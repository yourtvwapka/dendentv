<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Playing…</title>
<script src='//libtl.com/sdk.js' data-zone='10973078' data-sdk='show_10973078'></script>
<style>
  :root {
    --accent:#e50914; --accent-2:#f6121d; --line:#2a2a33;
    --card-2:#1e1e25; --text:#f5f5f7; --muted:#8a8a94;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#000; }
  body { color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }
  img { display:block; }

  .player { position:fixed; inset:0; background:#000; }
  .player-stage { position:absolute; inset:0; overflow:hidden; background:#000; }
  .player video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  .player-ui { position:absolute; inset:0; transition:opacity .25s ease; user-select:none; }
  .player-ui.idle { opacity:0; pointer-events:none; cursor:none; }

  .caption-overlay {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:8%; max-width:90%; text-align:center;
    pointer-events:none; z-index:3; transition:bottom .18s ease;
  }
  .caption-overlay[hidden] { display:none; }
  .caption-overlay .cap-line {
    display:inline-block; padding:3px 10px; border-radius:4px;
    white-space:pre-wrap; line-height:1.35; text-align:center;
  }

  .player-top {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:10px;
    padding:18px 22px 60px;
    background:linear-gradient(180deg, rgba(0,0,0,.85), transparent);
    pointer-events:none;
  }
  .player-top > * { pointer-events:auto; }
  .player-titles { min-width:0; flex:1; }
  .player-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-sub { font-size:12.5px; color:#b7b7c2; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .icon-btn {
    width:42px; height:42px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    color:#fff; border-radius:10px; cursor:pointer;
    transition:.15s; backdrop-filter:blur(6px);
  }
  .icon-btn:hover { background:rgba(255,255,255,.20); }
  .icon-btn:active { transform:scale(.94); }
  .icon-btn svg { width:20px; height:20px; fill:currentColor; }
  .icon-btn.small { width:36px; height:36px; }
  .icon-btn.small svg { width:17px; height:17px; }

  .menu-wrap { position:relative; flex:none; }
  .menu-btn {
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
    color:#fff; border-radius:10px; padding:10px 14px;
    font-size:13px; font-weight:700;
    cursor:pointer; backdrop-filter:blur(6px);
    white-space:nowrap; max-width:180px;
  }
  .menu-btn[hidden] { display:none; }
  .menu-btn .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .menu-btn .chev { width:11px; height:11px; fill:currentColor; opacity:.7; flex-shrink:0; }
  .menu-btn.open .chev { transform:rotate(180deg); }

  .menu-list {
    position:absolute; top:calc(100% + 6px); right:0;
    min-width:160px; max-height:60vh; overflow-y:auto;
    background:rgba(20,20,24,.95);
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px; padding:5px;
    z-index:20;
  }
  .menu-list[hidden] { display:none; }
  .menu-list button {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; background:transparent; border:none;
    color:#e5e5ea; padding:9px 12px; border-radius:8px;
    text-align:left; font-size:13px; font-weight:600; cursor:pointer;
  }
  .menu-list button:hover { background:rgba(255,255,255,.08); }
  .menu-list button.active { background:var(--accent); color:#fff; }
  .menu-list button .check { font-size:11px; opacity:0; flex-shrink:0; }
  .menu-list button.active .check { opacity:1; }

  .player-bigplay {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:84px; height:84px; border-radius:50%;
    background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.7);
    color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  .player-bigplay.hidden { display:none; }
  .player-bigplay svg { width:34px; height:34px; fill:#fff; margin-left:3px; }

  .player-bottom {
    position:absolute; left:0; right:0; bottom:0;
    padding:60px 22px 20px;
    background:linear-gradient(0deg, rgba(0,0,0,.88), transparent);
    pointer-events:none;
  }
  .player-bottom > * { pointer-events:auto; }

  .seek { position:relative; height:22px; display:flex; align-items:center; cursor:pointer; touch-action:none; margin-bottom:4px; }
  .seek-track { position:relative; width:100%; height:5px; border-radius:5px; background:rgba(255,255,255,.22); }
  .seek-buffer { position:absolute; inset:0 auto 0 0; border-radius:5px; background:rgba(255,255,255,.32); width:0; }
  .seek-played { position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent); width:0; }
  .seek-knob {
    position:absolute; top:50%; left:0; width:14px; height:14px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%) scale(0);
  }
  .seek:hover .seek-knob, .seek.scrubbing .seek-knob { transform:translate(-50%,-50%) scale(1); }
  .seek-tooltip {
    position:absolute; bottom:100%; margin-bottom:8px;
    padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.85); color:#fff; font-size:11px;
    transform:translateX(-50%); pointer-events:none; opacity:0;
  }
  .seek:hover .seek-tooltip, .seek.scrubbing .seek-tooltip { opacity:1; }

  .controls { display:flex; align-items:center; gap:10px; margin-top:2px; }
  .controls .spacer { flex:1; }
  .time { font-size:13px; color:#e5e5ea; white-space:nowrap; padding:0 4px; }
  .time .dim { color:#8a8a94; }

  .av-wrap { position:relative; display:flex; align-items:center; flex:none; }
  .av-panel {
    position:absolute; bottom:calc(100% + 12px); right:0;
    min-width:230px; background:rgba(20,20,24,.96);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:14px 16px;
    z-index:25;
    display:flex; flex-direction:column; gap:14px;
  }
  .av-panel[hidden] { display:none; }
  .av-row { display:flex; align-items:center; gap:10px; }
  .av-row .av-icon { width:18px; height:18px; fill:#c3c3cd; flex-shrink:0; }
  .av-row input[type="range"] {
    flex:1; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:4px; background:rgba(255,255,255,.18);
    outline:none; cursor:pointer; min-width:0;
  }
  .av-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--accent);
  }
  .av-row input[type="range"]::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--accent);
  }
  .av-row .val { font-size:11.5px; color:#8a8a94; min-width:38px; text-align:right; font-weight:600; }
  .av-divider { height:1px; background:#2a2a33; margin:-4px 0; }

  .player-feedback {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:14px 22px; border-radius:14px;
    background:rgba(0,0,0,.7); color:#fff; font-size:20px; font-weight:700;
    pointer-events:none; opacity:0; transition:opacity .18s; z-index:5;
  }
  .player-feedback.show { opacity:1; }

  .player-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(0,0,0,.82); color:var(--muted);
    font-size:14px; text-align:center; padding:30px; z-index:4;
  }
  .player-overlay[hidden] { display:none; }
  .player-overlay .err-title { color:#fff; font-size:16px; font-weight:600; }
  .player-overlay .err-msg { max-width:560px; line-height:1.55; font-size:13px; word-break:break-word; }
  .player-overlay .spinner {
    width:36px; height:36px; border:3px solid rgba(255,255,255,.15);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Live status during retry */
  .retry-status {
    position:absolute; top:80px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:rgba(20,20,24,.92);
    border:1px solid rgba(255,255,255,.12);
    padding:10px 16px; border-radius:10px;
    font-size:12.5px; color:#e5e5ea;
    z-index:6; pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .retry-status[hidden] { display:none; }
  .retry-status .status-spinner {
    width:14px; height:14px;
    border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  .retry-status.warn { background:rgba(120,53,15,.92); border-color:rgba(245,158,11,.4); }
  .retry-status.err { background:rgba(127,29,29,.92); border-color:rgba(239,68,68,.4); }

  .btn {
    display:inline-flex; align-items:center; gap:8px; background:var(--card-2);
    border:1px solid var(--line); color:#fff; padding:11px 20px;
    border-radius:10px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .btn:hover { border-color:#4a4a58; background:#26262f; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-2); border-color:var(--accent-2); }

  .error-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .error-detail {
    max-width:560px; width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px; padding:12px 14px;
    font-family:ui-monospace,monospace; font-size:11.5px;
    color:#c3c3cd; text-align:left; margin-top:12px;
    max-height:200px; overflow-y:auto;
    word-break:break-all;
  }
  .error-detail b { color:#93c5fd; }

  .log-panel { position:fixed; inset:0; z-index:600; background:rgba(13,13,15,.97); display:flex; flex-direction:column; }
  .log-panel[hidden] { display:none; }
  .log-head { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); background:#101014; flex-wrap:wrap; }
  .log-head h3 { font-size:13px; flex:0 0 auto; font-weight:700; min-width:80px; }
  .log-btn { background:var(--card-2); border:1px solid var(--line); color:#fff; padding:7px 10px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; }
  .log-btn.log-close { background:var(--accent); border-color:var(--accent); }
  .log-body { flex:1; overflow-y:auto; padding:8px 10px 40px; font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.5; }
  .log-empty { text-align:center; color:var(--muted); padding:60px 24px; font-size:13px; }
  .log-entry { display:flex; gap:8px; padding:7px 8px; border-radius:6px; margin-bottom:3px; background:rgba(255,255,255,.02); border-left:3px solid #444; font-family:ui-monospace,monospace; font-size:11.5px; }
  .log-entry.LOG { border-left-color:#555; color:#c3c3cd; }
  .log-entry.INFO { border-left-color:#3b82f6; color:#93c5fd; }
  .log-entry.NET { border-left-color:#06b6d4; color:#67e8f9; }
  .log-entry.WARN { border-left-color:#eab308; color:#fde047; background:rgba(234,179,8,.06); }
  .log-entry.ERR { border-left-color:var(--accent); color:#fca5a5; background:rgba(229,9,20,.1); font-weight:600; }
  .log-entry .log-time { color:#6b7280; flex-shrink:0; font-size:10.5px; }
  .log-entry .log-lvl { color:#4b5563; flex-shrink:0; font-size:10px; font-weight:700; }
  .log-entry .log-msg { flex:1; word-break:break-all; white-space:pre-wrap; min-width:0; }

  .ad-gate {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at top, rgba(229,9,20,.18), transparent 55%),
                linear-gradient(to bottom, #050505, #0a0a0a);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .ad-gate.hide { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .ad-gate-card {
    max-width: 440px; width: 100%;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px; padding: 32px 26px;
    text-align: center;
  }
  .ad-gate-icon { font-size: 48px; margin-bottom: 12px; }
  .ad-gate-title {
    font-size: 22px; font-weight: 800; margin-bottom: 8px;
    background: linear-gradient(90deg, #fff, #f9a8d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ad-gate-sub { font-size: 14px; color: #8a8a94; line-height: 1.6; margin-bottom: 22px; }
  .ad-gate-btn {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #e50914, #f6121d);
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .ad-gate-btn:disabled { opacity: .6; cursor: not-allowed; }
  .ad-gate-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ad-gate-status { font-size: 12.5px; color: #8a8a94; margin-top: 14px; min-height: 18px; font-weight: 600; }
  .ad-gate-status.err { color: #fca5a5; }

  @media (max-width: 640px) {
    .player-top { padding:12px 14px 40px; gap:6px; }
    .player-bottom { padding:40px 14px 14px; }
    .player-bigplay { width:68px; height:68px; }
    .icon-btn { width:36px; height:36px; }
    .icon-btn.small { width:34px; height:34px; }
    .menu-btn { padding:9px 10px; font-size:12px; max-width:120px; }
    .time { font-size:11.5px; padding:0 2px; }
    .player-title { font-size:14px; }
    .player-sub { font-size:11.5px; }
    .retry-status { font-size:11px; top:70px; padding:8px 12px; }
  }
</style>
</head>
<body>

<div class="ad-gate" id="adGate">
  <div class="ad-gate-card">
    <div class="ad-gate-icon">🎬</div>
    <div class="ad-gate-title">Watch a short ad to play</div>
    <div class="ad-gate-sub">Support the site — a quick ad keeps this player free. Your video starts right after.</div>
    <button class="ad-gate-btn" id="adGateBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Watch Ad &amp; Play
    </button>
    <div class="ad-gate-status" id="adGateStatus"></div>
  </div>
</div>

<div class="player" id="playerRoot">
  <div class="player-stage" id="playerStage">
    <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>

    <div class="caption-overlay" id="captionOverlay" hidden></div>

    <div class="player-ui" id="playerUI">
      <div class="player-top">
        <button class="icon-btn" id="playerBack" title="Back (Esc)">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="player-titles">
          <div class="player-title" id="playerTitle">Loading…</div>
          <div class="player-sub" id="playerSub"></div>
        </div>

        <div class="menu-wrap" id="capWrap" hidden>
          <button class="menu-btn" id="capBtn" title="Captions (C)">
            <span class="label" id="capLabel">CC</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="menu-list" id="capList" hidden></div>
        </div>

        <div class="menu-wrap" id="qualityWrap" hidden>
          <button class="menu-btn" id="qualityBtn" title="Change quality (Q)">
            <span class="label" id="qualityLabel">Auto</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="menu-list" id="qualityList" hidden></div>
        </div>

        <button class="icon-btn" id="btnNetInspector" title="Show logs (L)">
          <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3zm0 4h18v2H3zm0 4h18v2H3zm0 4h12v2H3zm14 0v6l4-3z"/></svg>
        </button>

        <button class="icon-btn" id="playerHome" title="Home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
      </div>

      <div class="retry-status" id="retryStatus" hidden>
        <div class="status-spinner"></div>
        <span id="retryStatusText">Loading…</span>
      </div>

      <button class="player-bigplay" id="bigPlay" title="Play / Pause (Space)">
        <svg id="bigPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="player-feedback" id="playerFeedback"></div>

      <div class="player-bottom">
        <div class="seek" id="seek">
          <div class="seek-tooltip" id="seekTooltip">0:00</div>
          <div class="seek-track">
            <div class="seek-buffer" id="seekBuffer"></div>
            <div class="seek-played" id="seekPlayed"></div>
          </div>
          <div class="seek-knob" id="seekKnob"></div>
        </div>

        <div class="controls">
          <button class="icon-btn" id="btnPlay" title="Play / Pause">
            <svg id="btnPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="btnRewind" title="-10s">
            <svg viewBox="0 0 24 24"><path d="M12.5 3a9 9 0 1 0 6.36 15.36l-1.42-1.42A7 7 0 1 1 12.5 5c.55 0 1.08.06 1.59.18L11.5 7.77V6.44L8.34 9.6 11.5 12.77v-1.33l3.32-3.32.07-.07A9 9 0 0 0 12.5 3z"/></svg>
          </button>
          <button class="icon-btn" id="btnForward" title="+10s">
            <svg viewBox="0 0 24 24"><path d="M11.5 3a9 9 0 1 1-6.36 15.36l1.42-1.42A7 7 0 1 0 11.5 5c-.55 0-1.08.06-1.59.18l2.59 2.59v-1.33l3.16 3.16-3.16 3.17v-1.33L9.18 8.11l-.07-.07A9 9 0 0 1 11.5 3z"/></svg>
          </button>

          <div class="time">
            <span id="timeCur">0:00</span>
            <span class="dim"> / <span id="timeDur">0:00</span></span>
          </div>

          <div class="spacer"></div>

          <div class="av-wrap" id="avWrap">
            <button class="icon-btn small" id="btnAv" title="Volume & Brightness">
              <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            </button>
            <div class="av-panel" id="avPanel" hidden>
              <div class="av-row">
                <svg class="av-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
                <span class="val" id="volVal">100%</span>
              </div>
              <div class="av-divider"></div>
              <div class="av-row">
                <svg class="av-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>
                <input type="range" id="bright" min="0.2" max="2" step="0.05" value="1" />
                <span class="val" id="brightVal">100%</span>
              </div>
            </div>
          </div>

          <button class="icon-btn small" id="btnPip" title="Picture in picture (I)">
            <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2zm-2 .02H3V4.98h18v14.04z"/></svg>
          </button>

          <button class="icon-btn" id="btnFull" title="Fullscreen (F)">
            <svg id="fullIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="player-overlay" id="playerLoading">
      <div class="spinner"></div>
      <div id="loadingText">Loading stream...</div>
      <div class="error-actions" id="loadingActions" hidden>
        <button class="btn" id="loadingSkip">Skip to next stream</button>
        <button class="btn" id="loadingGiveup">Give up</button>
      </div>
    </div>

    <div class="player-overlay" id="playerError" hidden>
      <div class="err-title">Playback failed</div>
      <div class="err-msg" id="playerErrorMsg"></div>
      <div class="error-actions">
        <button class="btn btn-primary" id="playerRetry">Retry</button>
        <button class="btn" id="playerShowLogs2">Show Logs</button>

</div>

<script>
/* ═══════════ CONFIG ═══════════ */
const QS = new URLSearchParams(location.search);
const P = {
  detailPath: QS.get("detailPath") || "",
  mainDetailPath: QS.get("mainDetailPath") || QS.get("detailPath") || "",
  subjectId: QS.get("subjectId") || "",
  se: QS.get("se") || "",
  ep: QS.get("ep") || "",
  isSeries: QS.get("isSeries") === "1",
  title: QS.get("title") || "Untitled",
  subtitle: QS.get("subtitle") || "",
  lang: QS.get("lang") || "",
  streamUrl: QS.get("streamUrl") || "",
};

const PROXY_URL = location.origin;
const BASE = "https://officialmoviebox.com";
const HLS_CDN = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";

/* Retry budget */
const MAX_STREAM_ATTEMPTS = 8;      // absolute max stream tries
const MAX_API_REFRESHES = 2;        // max times we re-call the play API
const ATTEMPT_TIMEOUT_MS = 15000;   // per-stream timeout
const TOTAL_TIMEOUT_MS = 60000;     // absolute max time on this page before failing

/* ═══════════ LOGGING ═══════════ */
const LOG = [];
const logBodyEl = document.getElementById("logBody");
const logPanelEl = document.getElementById("logPanel");

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function nowTime() {
  return new Date().toLocaleTimeString("en-GB", { hour12: false });
}
function logPush(level, ...args) {
  const text = args.map(a => typeof a === "object" ? JSON.stringify(a) : String(a)).join(" ");
  LOG.push({ t: nowTime(), l: level, m: text });
  if (LOG.length > 2000) LOG.shift();
  if (!logPanelEl.hidden) renderLogs();
}
const _log = console.log.bind(console);
const _warn = console.warn.bind(console);
const _err = console.error.bind(console);
console.log = (...a) => { _log(...a); logPush("LOG", ...a); };
console.warn = (...a) => { _warn(...a); logPush("WARN", ...a); };
console.error = (...a) => { _err(...a); logPush("ERR", ...a); };

function renderLogs() {
  if (!LOG.length) {
    logBodyEl.innerHTML = '<div class="log-empty">No logs yet.</div>';
    return;
  }
  logBodyEl.innerHTML = LOG.map(e =>
    `<div class="log-entry ${e.l}"><span class="log-time">${e.t}</span><span class="log-lvl">${e.l}</span><span class="log-msg">${escapeHtml(e.m)}</span></div>`
  ).join("");
  logBodyEl.scrollTop = logBodyEl.scrollHeight;
}

document.getElementById("logClose").addEventListener("click", () => {
  logPanelEl.hidden = true;
});
document.getElementById("logCopyAll").addEventListener("click", () => {
  const txt = LOG.map(e => `[${e.t}] ${e.l} ${e.m}`).join("\n");
  navigator.clipboard.writeText(txt).then(() => {
    document.getElementById("logCopyAll").textContent = "Copied!";
    setTimeout(() => document.getElementById("logCopyAll").textContent = "Copy All", 1500);
  });
});
document.getElementById("logClear").addEventListener("click", () => {
  LOG.length = 0;
  renderLogs();
});

/* ═══════════ DOM REFS ═══════════ */
const video = document.getElementById("video");
const playerLoading = document.getElementById("playerLoading");
const playerError = document.getElementById("playerError");
const playerErrorMsg = document.getElementById("playerErrorMsg");
const playerErrorDetail = document.getElementById("playerErrorDetail");
const loadingText = document.getElementById("loadingText");
const loadingActions = document.getElementById("loadingActions");
const retryStatus = document.getElementById("retryStatus");
const retryStatusText = document.getElementById("retryStatusText");
const playerTitle = document.getElementById("playerTitle");
const playerSub = document.getElementById("playerSub");
const playerUI = document.getElementById("playerUI");
const captionOverlay = document.getElementById("captionOverlay");
const qualityWrap = document.getElementById("qualityWrap");
const qualityBtn = document.getElementById("qualityBtn");
const qualityList = document.getElementById("qualityList");
const qualityLabel = document.getElementById("qualityLabel");
const capWrap = document.getElementById("capWrap");
const capBtn = document.getElementById("capBtn");
const capList = document.getElementById("capList");
const capLabel = document.getElementById("capLabel");
const seekEl = document.getElementById("seek");
const seekBuffer = document.getElementById("seekBuffer");
const seekPlayed = document.getElementById("seekPlayed");
const seekKnob = document.getElementById("seekKnob");
const seekTooltip = document.getElementById("seekTooltip");
const timeCur = document.getElementById("timeCur");
const timeDur = document.getElementById("timeDur");
const btnPlay = document.getElementById("btnPlay");
const btnPlayIcon = document.getElementById("btnPlayIcon");
const bigPlay = document.getElementById("bigPlay");
const bigPlayIcon = document.getElementById("bigPlayIcon");
const playerFeedback = document.getElementById("playerFeedback");

const ICON_PLAY = "M8 5v14l11-7z";
const ICON_PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";

/* ═══════════ PLAYER STATE ═══════════ */
const player = {
  streams: [],
  currentIdx: 0,
  hls: null,
  signCookie: "",
  triedUrls: new Set(),
  apiRefreshes: 0,
  attemptCount: 0,
  busy: false,
  totalTimer: null,
  attemptTimer: null,
  abort: null,
  captions: [],
  captionIndex: -1,
  captionBlobUrl: null,
  captionTrackEl: null,
};

function proxied(realUrl, referer, cookie) {
  let u = PROXY_URL + "/?url=" + encodeURIComponent(realUrl)
        + "&referer=" + encodeURIComponent(referer || BASE + "/");
  if (cookie) u += "&cookie=" + encodeURIComponent(cookie);
  return u;
}
function absolute(base, path) { return new URL(path, base + "/").toString(); }
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const s = Math.floor(sec % 60), m = Math.floor((sec / 60) % 60), h = Math.floor(sec / 3600);
  return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") : m + ":" + String(s).padStart(2, "0");
}
function showFeedback(text) {
  playerFeedback.textContent = text;
  playerFeedback.classList.add("show");
  clearTimeout(showFeedback._t);
  showFeedback._t = setTimeout(() => playerFeedback.classList.remove("show"), 500);
}
function setRetryStatus(text, cls) {
  if (!text) {
    retryStatus.hidden = true;
    return;
  }
  retryStatus.hidden = false;
  retryStatus.className = "retry-status" + (cls ? " " + cls : "");
  retryStatusText.textContent = text;
}

/* ═══════════ NUXT DECODER ═══════════ */
const DEVALUE_WRAPPERS = {
  "ShallowReactive": v => v, "Reactive": v => v, "Ref": v => v,
  "ShallowRef": v => v, "EmptyRef": () => undefined, "EmptyShallowRef": () => undefined,
  "Set": v => v, "Map": v => v, "Date": v => v, "RegExp": v => v, "BigInt": v => v,
  "null": () => null, "undefined": () => undefined, "NaN": () => NaN,
  "Infinity": () => Infinity, "-Infinity": () => -Infinity,
};
function devalueResolve(arr) {
  const cache = new Map();
  function go(ref) {
    if (ref === null || ref === undefined) return ref;
    if (typeof ref !== "number") return ref;
    if (cache.has(ref)) return cache.get(ref);
    const v = arr[ref];
    if (v === null || v === undefined || typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      cache.set(ref, v); return v;
    }
    if (Array.isArray(v)) {
      if (v.length >= 1 && typeof v[0] === "string" && DEVALUE_WRAPPERS[v[0]]) {
        const inner = v.length > 1 ? go(v[1]) : undefined;
        const wrapped = DEVALUE_WRAPPERS[v[0]](inner);
        cache.set(ref, wrapped); return wrapped;
      }
      const out = []; cache.set(ref, out);
      for (const item of v) out.push(go(item));
      return out;
    }
    if (typeof v === "object") {
      const out = {}; cache.set(ref, out);
      for (const k of Object.keys(v)) out[k] = go(v[k]);
      return out;
    }
    cache.set(ref, v); return v;
  }
  return go(0);
}

/* ═══════════ STREAM FETCHING ═══════════ */
function pick(obj, ...keys) {
  for (const k of keys) { const v = obj?.[k]; if (v !== undefined && v !== null && v !== "") return v; }
  return undefined;
}

async function fetchStreams(signal) {
  const subjectId = P.subjectId;
  const detailPath = P.detailPath;
  const se = P.isSeries ? Number(P.se) : 0;
  const ep = P.isSeries ? Number(P.ep) : 0;

  if (!subjectId || !detailPath) throw new Error("Missing detailPath or subjectId");

  const watchParams = new URLSearchParams({ id: subjectId, type: "/movie/detail", lang: "en" });
  if (se) watchParams.set("detailSe", String(se));
  if (ep) watchParams.set("detailEp", String(ep));
  const referer = absolute(BASE, "/movies/" + detailPath + "?" + watchParams);

  const playParams = new URLSearchParams({ subjectId: String(subjectId), detailPath });
  if (se && ep) { playParams.set("se", String(se)); playParams.set("ep", String(ep)); }

  const realPlayUrl = absolute(BASE, "/wefeed-h5api-bff/subject/play?" + playParams);
  const fetchUrl = proxied(realPlayUrl, referer);

  logPush("LOG", "[play] fetching:", playParams.toString());

  const res = await fetch(fetchUrl, { signal });
  const body = await res.clone().text();
  let json = null;
  try { json = JSON.parse(body); } catch (_) {}

  if (!res.ok) throw new Error("Play HTTP " + res.status);
  if (!json) throw new Error("Play response not JSON");
  if (json.code !== 0) throw new Error(json.message || "Play code " + json.code);

  return normalizeStreams(json.data, referer);
}

function normalizeStreams(data, pageReferer) {
  if (!data) return { streams: [], signCookie: "" };
  const d = data.data || data;
  const signCookie = String(pick(d, "signCookie", "cookie") || "");
  const containers = ["streams", "hls", "dash", "streamList", "sources", "urls", "list"];
  let list = [];
  for (const key of containers) {
    const v = d[key];
    if (Array.isArray(v) && v.length) list = list.concat(v);
  }
  if (!list.length && pick(d, "url", "playUrl", "src")) list = [d];
  const seen = new Set(), streams = [];
  const cdnReferer = pageReferer || (BASE + "/");

  for (const s of list) {
    if (!s) continue;
    const rawUrl = typeof s === "string" ? s : pick(s, "url", "playUrl", "src", "file", "link") || "";
    if (!rawUrl || seen.has(rawUrl)) continue;
    seen.add(rawUrl);
    const url = rawUrl.startsWith("http") ? proxied(rawUrl, cdnReferer, signCookie) : rawUrl;
    const rawQ = pick(s, "resolutions", "resolution", "quality", "definition", "resName", "label", "name") || "";
    let quality = "Auto";
    if (rawQ) {
      const parts = String(rawQ).split(",");
      const nums = parts.map((v) => parseInt(String(v).trim().replace(/p$/i, ""), 10)).filter((n) => !isNaN(n) && n > 0);
      quality = nums.length ? String(Math.max(...nums)) : String(rawQ).trim();
    }
    streams.push({
      url, quality,
      format: String(pick(s, "format", "type") || "").toUpperCase(),
      id: String(pick(s, "id", "resourceId") || ""),
    });
  }

  streams.sort((a, b) => {
    const ai = parseInt(a.quality, 10), bi = parseInt(b.quality, 10);
    if (isNaN(ai) && isNaN(bi)) return 0;
    if (isNaN(ai)) return 1;
    if (isNaN(bi)) return -1;
    return bi - ai;
  });

  const maxRes = Number(d?.playConfig?.maxResolution) || 0;
  let finalStreams = streams;
  if (maxRes > 0) {
    const capped = streams.filter((s) => {
      const q = parseInt(s.quality, 10);
      return !isNaN(q) && q <= maxRes;
    });
    if (capped.length) finalStreams = capped;
  }

  logPush("LOG", "[play] got " + finalStreams.length + " streams: " + finalStreams.map(s => s.quality).join(", "));
  return { streams: finalStreams, signCookie };
}

/* ═══════════ PLAYBACK CONTROLLER ═══════════ */
async function startPlayback(opts = {}) {
  const isRetry = opts.isRetry === true;

  /* Reset UI */
  playerError.hidden = true;
  playerLoading.hidden = false;
  loadingActions.hidden = true;
  setRetryStatus("");
  loadingText.textContent = "Loading stream...";

  /* Clear any existing timers */
  clearTimeout(player.totalTimer);
  clearTimeout(player.attemptTimer);

  /* Total timeout — fires if we haven't started playback in TOTAL_TIMEOUT_MS */
  player.totalTimer = setTimeout(() => {
    if (video.readyState === 0 || video.ended) {
      logPush("ERR", "[timeout] total elapsed " + TOTAL_TIMEOUT_MS + "ms with no video");
      failPlayback(
        "Stream timed out",
        "The video didn't start within " + (TOTAL_TIMEOUT_MS / 1000) + " seconds.",
        { reason: "total_timeout" }
      );
    }
  }, TOTAL_TIMEOUT_MS);

  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  if (player.abort) { try { player.abort.abort(); } catch (_) {} }
  player.abort = new AbortController();

  try {
    /* Direct stream mode */
    if (P.streamUrl) {
      setRetryStatus("Attaching direct stream…");
      const stream = {
        url: P.streamUrl,
        quality: "Auto",
        format: /\.m3u8([?#&]|$)/i.test(P.streamUrl) ? "HLS" : "MP4",
      };
      player.streams = [stream];
      player.currentIdx = 0;
      await tryStream(stream, 0);
      return;
    }

    /* Fetch streams if we don't have any (first run) or API refresh */
    if (!isRetry || player.streams.length === 0) {
      setRetryStatus("Fetching stream list…");
      loadingText.textContent = "Fetching stream list...";
      const { streams, signCookie } = await fetchStreams(player.abort.signal);
      if (!streams.length) throw new Error("API returned 0 streams");
      player.streams = streams;
      player.signCookie = signCookie || "";
      player.currentIdx = 0;
      buildQualityMenu();
      loadCaptionsForCurrentStream();
    }

    setRetryStatus("");
    await tryStream(player.streams[player.currentIdx], player.currentIdx);

  } catch (err) {
    if (err.name === "AbortError") return;
    logPush("ERR", "[play] start failed:", err.message);
    failPlayback("Could not start playback", err.message || "Unknown error");
  }
}

async function tryStream(stream, idx) {
  clearTimeout(player.attemptTimer);
  player.currentIdx = idx;
  const total = player.streams.length;
  const label = stream.quality && stream.quality !== "Auto" ? stream.quality : "Auto";

  player.attemptCount++;
  logPush("LOG", "[stream] attempt " + player.attemptCount + "/" + MAX_STREAM_ATTEMPTS +
                  " → " + label + " (" + idx + "/" + total + ")");

  if (player.attemptCount > MAX_STREAM_ATTEMPTS) {
    logPush("ERR", "[stream] exceeded max attempts");
    return failPlayback(
      "Too many failed attempts",
      "Tried " + MAX_STREAM_ATTEMPTS + " streams without success. The CDN may be blocking the request, or all URLs are stale."
    );
  }

  setRetryStatus("Trying stream " + (idx + 1) + "/" + total + " · " + label, "");
  loadingText.textContent = "Trying " + label + "...";
  loadingActions.hidden = false;

  /* Per-attempt timeout — this stream failed if it doesn't reach canplay in ATTEMPT_TIMEOUT_MS */
  player.attemptTimer = setTimeout(() => {
    if (video.readyState === 0) {
      logPush("WARN", "[stream] attempt timeout (" + ATTEMPT_TIMEOUT_MS + "ms) for " + label);
      advanceToNextStream("Stream " + label + " timed out");
    }
  }, ATTEMPT_TIMEOUT_MS);

  /* Tear down any old playback */
  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  video.removeAttribute("src");
  try { video.load(); } catch (_) {}

  const url = stream.url;
  player.triedUrls.add(url);
  const isHls = /\.m3u8([?#&]|$)/i.test(url) || /mpegurl/i.test(stream.format);

  try {
    if (isHls && !video.canPlayType("application/vnd.apple.mpegurl")) {
      await attachHls(url);
    } else {
      await attachNative(url);
    }
  } catch (err) {
    logPush("ERR", "[stream] attach failed:", err.message);
    advanceToNextStream(err.message || "Attach failed");
  }
}

function attachNative(url) {
  return new Promise((resolve, reject) => {
    const onReady = () => {
      clearTimeout(player.attemptTimer);
      video.removeEventListener("canplay", onReady);
      video.removeEventListener("error", onErr);
      playerLoading.hidden = true;
      setRetryStatus("");
      loadingActions.hidden = true;
      video.play().catch(() => {});
      logPush("LOG", "[stream] native playback ready");
      resolve();
    };
    const onErr = () => {
      clearTimeout(player.attemptTimer);
      video.removeEventListener("canplay", onReady);
      video.removeEventListener("error", onErr);
      const code = video.error?.code;
      const errText = code === 4 ? "source not supported (likely blocked by CDN)" : "video error " + code;
      reject(new Error(errText));
    };
    video.addEventListener("canplay", onReady, { once: false });
    video.addEventListener("error", onErr, { once: false });
    video.src = url;
    video.load();
  });
}

async function attachHls(url) {
  const Hls = await loadHlsLib();
  if (!Hls.isSupported()) {
    return attachNative(url);
  }

  return new Promise((resolve, reject) => {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 1,
      levelLoadingTimeOut: 12000,
      fragLoadingTimeOut: 20000,
    });

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      clearTimeout(player.attemptTimer);
      playerLoading.hidden = true;
      setRetryStatus("");
      loadingActions.hidden = true;
      video.play().catch(() => {});
      logPush("LOG", "[hls] manifest parsed, playing");
      resolve();
    });

    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      logPush("ERR", "[hls] fatal:", data.type, data.details);
      clearTimeout(player.attemptTimer);
      try { hls.destroy(); } catch (_) {}
      player.hls = null;
      reject(new Error("HLS " + (data.details || data.type)));
    });

    hls.loadSource(url);
    hls.attachMedia(video);
    player.hls = hls;
  });
}

function loadHlsLib() {
  if (window.Hls) return Promise.resolve(window.Hls);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = HLS_CDN;
    s.onload = () => resolve(window.Hls);
    s.onerror = () => reject(new Error("Failed to load hls.js"));
    document.head.appendChild(s);
  });
}

async function advanceToNextStream(reason) {
  if (player.busy) return;
  player.busy = true;
  clearTimeout(player.attemptTimer);

  try {
    logPush("LOG", "[stream] advancing (reason: " + (reason || "unknown") + ")");

    /* Try the next untried stream first */
    const total = player.streams.length;
    for (let i = 0; i < total; i++) {
      const nextIdx = (player.currentIdx + 1 + i) % total;
      const next = player.streams[nextIdx];
      if (!next || player.triedUrls.has(next.url)) continue;
      logPush("LOG", "[stream] trying next stream #" + nextIdx);
      await tryStream(next, nextIdx);
      return;
    }

    /* All streams tried — refresh play API for new tokens */
    if (player.apiRefreshes < MAX_API_REFRESHES) {
      player.apiRefreshes++;
      logPush("LOG", "[stream] all tried — refreshing play API (" + player.apiRefreshes + "/" + MAX_API_REFRESHES + ")");
      setRetryStatus("Refreshing play API (" + player.apiRefreshes + "/" + MAX_API_REFRESHES + ")…", "warn");
      loadingText.textContent = "Refreshing stream tokens...";
      player.triedUrls.clear();
      player.streams = [];

      await new Promise((r) => setTimeout(r, 1000));

      try {
        const { streams, signCookie } = await fetchStreams(player.abort.signal);
        if (!streams.length) throw new Error("API returned 0 streams on refresh");
        player.streams = streams;
        if (signCookie) player.signCookie = signCookie;
        buildQualityMenu();
        logPush("LOG", "[stream] API refresh returned " + streams.length + " fresh streams");
        await tryStream(streams[0], 0);
        return;
      } catch (e) {
        logPush("ERR", "[stream] API refresh failed:", e.message);
      }
    }

    /* Give up */
    logPush("ERR", "[stream] giving up after " + player.attemptCount + " attempts, " + player.apiRefreshes + " API refreshes");
    failPlayback(
      "All streams failed",
      "Tried " + player.attemptCount + " attempts across " + player.streams.length +
      " streams" + (player.apiRefreshes ? " (" + player.apiRefreshes + " API refreshes)" : "") +
      ". The CDN may be blocking the video request or the URL may have expired."
    );
  } finally {
    player.busy = false;
  }
}

function failPlayback(title, message, extra) {
  clearTimeout(player.totalTimer);
  clearTimeout(player.attemptTimer);
  if (player.hls) { try { player.hls.destroy(); } catch (_) {} player.hls = null; }
  setRetryStatus("");
  playerLoading.hidden = true;
  loadingActions.hidden = true;

  logPush("ERR", "[fail] " + title + " — " + message);

  playerError.hidden = false;
  playerErrorMsg.innerHTML = escapeHtml(message);

  /* Show diagnostic detail */
  if (extra || player.triedUrls.size) {
    playerErrorDetail.hidden = false;
    const details = [];
    details.push("<b>Attempts:</b> " + player.attemptCount);
    details.push("<b>API refreshes:</b> " + player.apiRefreshes);
    details.push("<b>Streams tried:</b> " + player.triedUrls.size);
    if (player.streams.length) {
      details.push("<b>Total streams:</b> " + player.streams.length);
    }
    if (extra?.reason) details.push("<b>Reason:</b> " + extra.reason);
    playerErrorDetail.innerHTML = details.join("<br>");
  } else {
    playerErrorDetail.hidden = true;
  }
}

/* ═══════════ VIDEO EVENTS ═══════════ */
let playbackStarted = false;

video.addEventListener("playing", () => {
  playbackStarted = true;
  clearTimeout(player.totalTimer);
  clearTimeout(player.attemptTimer);
  playerLoading.hidden = true;
  playerError.hidden = true;
  setRetryStatus("");
  loadingActions.hidden = true;
  logPush("LOG", "[video] playing");
});

video.addEventListener("waiting", () => {
  if (playbackStarted) {
    setRetryStatus("Buffering…");
  }
});

video.addEventListener("error", (e) => {
  /* This fires when video.src fails to load (e.g., CDN 426, network error) */
  const v = video.error;
  if (v) {
    logPush("WARN", "[video] MediaError code=" + v.code + " msg=" + (v.message || "?"));
  }
  /* Only handle if we're currently in the middle of an attempt */
  if (!playerLoading.hidden && !player.busy) {
    clearTimeout(player.attemptTimer);
    advanceToNextStream("video element error");
  }
});

/* ═══════════ CONTROLS ═══════════ */
function setPlayIcon(playing) {
  btnPlayIcon.querySelector("path").setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
  bigPlayIcon.querySelector("path").setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
  bigPlay.classList.toggle("hidden", playing);
}
video.addEventListener("play", () => setPlayIcon(true));
video.addEventListener("pause", () => setPlayIcon(false));

function togglePlay() {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
}
btnPlay.addEventListener("click", togglePlay);
bigPlay.addEventListener("click", togglePlay);

video.addEventListener("timeupdate", () => {
  const d = video.duration || 0;
  const p = d ? (video.currentTime / d) * 100 : 0;
  seekPlayed.style.width = p + "%";
  seekKnob.style.left = p + "%";
  timeCur.textContent = formatTime(video.currentTime);
});
video.addEventListener("progress", () => {
  if (!video.buffered.length || !video.duration) return;
  const end = video.buffered.end(video.buffered.length - 1);
  seekBuffer.style.width = (end / video.duration) * 100 + "%";
});
video.addEventListener("loadedmetadata", () => {
  timeDur.textContent = formatTime(video.duration);
});

/* Seek */
let scrubbing = false;
seekEl.addEventListener("pointerdown", (e) => {
  scrubbing = true;
  seekEl.classList.add("scrubbing");
  seekEl.setPointerCapture(e.pointerId);
  applySeek(e, false);
});
seekEl.addEventListener("pointermove", (e) => {
  if (scrubbing) applySeek(e, false);
});
seekEl.addEventListener("pointerup", (e) => {
  if (!scrubbing) return;
  scrubbing = false;
  seekEl.classList.remove("scrubbing");
  applySeek(e, true);
});
function applySeek(e, update) {
  if (!video.duration) return;
  const r = seekEl.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const t = ratio * video.duration;
  seekPlayed.style.width = ratio * 100 + "%";
  seekKnob.style.left = ratio * 100 + "%";
  timeCur.textContent = formatTime(t);
  if (update) video.currentTime = t;
}

/* Volume/brightness */

const volVal = document.getElementById("volVal");
const brightSlider = document.getElementById("bright");
const brightVal = document.getElementById("brightVal");

const avWrap = document.getElementById("avWrap");

/* ═══════════ QUALITY MENU ═══════════ */
function buildQualityMenu() {
  if (!player.streams.length) { qualityWrap.hidden = true; return; }
  qualityWrap.hidden = false;
  qualityList.innerHTML = player.streams.map((s, i) =>
    `<button type="button" data-q="${i}"><span>${escapeHtml(s.quality)}</span><span class="check">✓</span></button>`
  ).join("");
  qualityList.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.q);
      qualityList.hidden = true;
      qualityBtn.classList.remove("open");
      player.currentIdx = idx;
      player.triedUrls.clear();
      player.apiRefreshes = 0;
      player.attemptCount = 0;
      playerLoading.hidden = false;
      playerError.hidden = true;
      startPlayback({ isRetry: true });
    });
  });
  qualityLabel.textContent = player.streams[0].quality;
}
qualityBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  qualityList.hidden = !qualityList.hidden;
  qualityBtn.classList.toggle("open", !qualityList.hidden);
});
document.addEventListener("click", (e) => {
  if (!qualityWrap.contains(e.target)) {
    qualityList.hidden = true;
    qualityBtn.classList.remove("open");
  }
});

/* ═══════════ CAPTIONS (basic) ═══════════ */
async function loadCaptionsForCurrentStream() {
  const stream = player.streams[0];
  if (!stream || !stream.id || !stream.format) { capWrap.hidden = true; return; }
  try {
    const params = new URLSearchParams({
      format: stream.format, id: stream.id,
      subjectId: P.subjectId, detailPath: P.detailPath,
    });
    const url = absolute(BASE, "/wefeed-h5api-bff/subject/caption?" + params);
    const referer = absolute(BASE, "/movies/" + P.detailPath);
    const res = await fetch(proxied(url, referer));
    if (!res.ok) { capWrap.hidden = true; return; }
    const json = await res.json();
    const raw = json?.data?.captions || json?.data?.captionList || json?.data?.list || [];
    if (!raw.length) { capWrap.hidden = true; return; }
    player.captions = raw.map(c => ({
      lang: pick(c, "lan", "lang") || "",
      name: pick(c, "lanName", "language", "label") || "Subtitle",
      url: pick(c, "url", "src", "file") || "",
    })).filter(c => c.url);
    capWrap.hidden = player.captions.length === 0;
    if (player.captions.length) buildCaptionMenu();
  } catch (_) {
    capWrap.hidden = true;
  }
}
function buildCaptionMenu() {
  capList.innerHTML = '<button data-c="-1"><span>Off</span><span class="check">✓</span></button>' +
    player.captions.map((c, i) =>
      `<button data-c="${i}"><span>${escapeHtml(c.name)}</span><span class="check">✓</span></button>`
    ).join("");
  capList.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.c);
      capList.hidden = true;
      capBtn.classList.remove("open");
      if (i === -1) deselectCaption();
      else selectCaption(i);
    });
  });
}
function updateCaptionMenu() {
  capLabel.textContent = player.captionIndex === -1 ? "CC" :
    (player.captions[player.captionIndex]?.name || "CC");
}
function deselectCaption() {
  player.captionIndex = -1;
  removeCaptionTrack();
  updateCaptionMenu();
}
async function selectCaption(idx) {
  const cap = player.captions[idx];
  if (!cap) return;
  try {
    const referer = absolute(BASE, "/movies/" + P.detailPath);
    const res = await fetch(proxied(cap.url, referer));
    if (!res.ok) throw new Error("HTTP " + res.status);
    let text = await res.text();
    if (!/^\s*WEBVTT/i.test(text)) {
      text = "WEBVTT\n\n" + text.replace(/\r+/g, "").replace(/^\d+\s*$/gm, "").replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
    }
    applyCaptionTrack(text, cap.name);
    player.captionIndex = idx;
    updateCaptionMenu();
  } catch (e) {
    logPush("ERR", "[cap] failed:", e.message);
  }
}
function removeCaptionTrack() {
  if (player.captionTrackEl) { try { player.captionTrackEl.remove(); } catch (_) {} player.captionTrackEl = null; }
  if (player.captionBlobUrl) { try { URL.revokeObjectURL(player.captionBlobUrl); } catch (_) {} player.captionBlobUrl = null; }
  if (captionOverlay) { captionOverlay.hidden = true; captionOverlay.innerHTML = ""; }
}
function applyCaptionTrack(vttText, label) {
  removeCaptionTrack();
  const blob = new Blob([vttText], { type: "text/vtt;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const track = document.createElement("track");
  track.kind = "subtitles";
  track.label = label || "Subtitle";
  track.srclang = "en";
  track.src = url;
  track.default = true;
  video.appendChild(track);
  player.captionTrackEl = track;
  player.captionBlobUrl = url;
  setTimeout(() => {
    const tt = track.track;
    if (!tt) return;
    tt.mode = "hidden";
    tt.addEventListener("cuechange", renderCues);
  }, 200);
}
function renderCues(e) {
  const tt = e.target;
  if (!tt || !captionOverlay) return;
  if (player.captionIndex === -1) { captionOverlay.hidden = true; return; }
  const cues = tt.activeCues;
  if (!cues || !cues.length) { captionOverlay.hidden = true; return; }
  const parts = [];
  for (let i = 0; i < cues.length; i++) {
    const txt = (cues[i].text || "").replace(/<[^>]+>/g, "").trim();
    if (txt) parts.push(escapeHtml(txt));
  }
  if (!parts.length) { captionOverlay.hidden = true; return; }
  captionOverlay.innerHTML = '<div class="cap-line">' + parts.join("<br>") + "</div>";
  captionOverlay.hidden = false;
}
capBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  capList.hidden = !capList.hidden;
  capBtn.classList.toggle("open", !capList.hidden);
});
document.addEventListener("click", (e) => {

    capBtn.classList.remove("open");

});

/* ═══════════ KEYBOARD ═══════════ */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "Escape") {
    if (!logPanelEl.hidden) { logPanelEl.hidden = true; return; }
    if (history.length > 1) history.back();
    else location.href = "index.html";
    return;
  }
  switch (e.key) {
    case " ": case "k": e.preventDefault(); togglePlay(); break;
    case "ArrowRight": e.preventDefault(); if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10); break;
    case "ArrowLeft": e.preventDefault(); if (video.duration) video.currentTime = Math.max(0, video.currentTime - 10); break;
    case "ArrowUp": e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); volumeSlider.value = video.volume; break;
    case "ArrowDown": e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); volumeSlider.value = video.volume; break;
    case "m": case "M": e.preventDefault(); video.muted = !video.muted; break;
    case "f": case "F":
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.().catch(() => {});
      break;
    case "l": case "L": e.preventDefault(); logPanelEl.hidden = !logPanelEl.hidden; if (!logPanelEl.hidden) renderLogs(); break;
  }
});

document.getElementById("btnFull").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});

document.getElementById("playerBack").addEventListener("click", () => {
  if (history.length > 1) history.back();
  else location.href = "index.html";
});
document.getElementById("playerHome").addEventListener("click", () => {
  location.href = "index.html";
});
document.getElementById("btnPip").addEventListener("click", async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch (_) {}
});
document.getElementById("btnRewind").addEventListener("click", () => {
  if (video.duration) video.currentTime = Math.max(0, video.currentTime - 10);
});
document.getElementById("btnForward").addEventListener("click", () => {
  if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10);
});

/* ═══════════ AD GATE ═══════════ */
function hideAdGate() {
  const gate = document.getElementById("adGate");
  if (!gate) return;
  gate.classList.add("hide");
  setTimeout(() => gate.remove(), 320);
}
async function startWithAd() {
  const btn = document.getElementById("adGateBtn");
  const status = document.getElementById("adGateStatus");
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  status.classList.remove("err");
  status.textContent = "Loading ad…";
  try {
    if (typeof show_10973078 !== "function") throw new Error("Ad SDK not loaded");
    await show_10973078();
    status.textContent = "Starting video…";
  } catch (e) {
    logPush("WARN", "[ad] failed:", e.message);
    status.classList.add("err");
    status.textContent = "Ad unavailable — starting anyway…";
    await new Promise(r => setTimeout(r, 600));
  }
  hideAdGate();
  startPlayback({ isRetry: false });
}

/* ═══════════ BOOT ═══════════ */
playerTitle.textContent = P.title;
playerSub.textContent = P.subtitle;

if (!P.streamUrl && (!P.detailPath || !P.subjectId)) {
  failPlayback("Missing URL parameters", "Open this page from the catalog.");
  hideAdGate();
} else {
  playerLoading.hidden = true;
  document.getElementById("adGateBtn").addEventListener("click", startWithAd);
}
