<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Details</title>
<style>
  :root {
    --accent: #e50914; --accent-2: #f6121d;
    --line: #2a2a33; --card: #1e1e25; --card-2: #26262f;
    --text: #f5f5f7; --muted: #8a8a94; --bg: #000;
    --warn: #f59e0b; --warn-bg: rgba(245,158,11,.08); --warn-bd: rgba(245,158,11,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  img { display: block; }

  .page { max-width: 1400px; margin: 0 auto; padding: 0 20px 100px; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    position: sticky; top: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.95) 60%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 50;
    margin: 0 -20px;
  }
  .back-btn {
    width: 42px; height: 42px; border-radius: 10px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: .15s;
  }
  .back-btn:hover { background: rgba(255,255,255,.16); }
  .back-btn:active { transform: scale(.94); }
  .topbar h1 { font-size: 16px; font-weight: 700; }

  /* ═══════════ HERO ═══════════ */
  .hero {
    position: relative;
    margin: 24px 0 32px;
    padding: 32px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .hero-backdrop {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.22;
    z-index: 0;
    filter: blur(1px);
  }
  .hero-backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.75) 100%);
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
  }
  @media (max-width: 720px) {
    .hero { padding: 20px; }
    .hero-inner { grid-template-columns: 1fr; gap: 20px; text-align: center; }
  }
  .poster {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a20 0%, #0a0a0d 100%);
    border: 1px solid rgba(255,255,255,.08);
    max-width: 260px;
    box-shadow: 0 16px 40px rgba(0,0,0,.6);
  }
  @media (max-width: 720px) { .poster { max-width: 180px; margin: 0 auto; } }
  .poster img { width: 100%; height: 100%; object-fit: cover; }
  .poster .fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 800; color: rgba(255,255,255,.2);
  }
  .info { min-width: 0; }
  .info h1 {
    font-size: 32px; line-height: 1.15; font-weight: 800;
    margin-bottom: 12px; letter-spacing: -.5px;
  }
  @media (max-width: 720px) { .info h1 { font-size: 24px; } }
  .meta {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    font-size: 13px; color: var(--muted);
    margin-bottom: 14px;
    align-items: center;
  }
  @media (max-width: 720px) { .meta { justify-content: center; } }
  .meta .badge {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .4px;
    text-transform: uppercase; color: #e5e5ea;
  }
  .meta .rating { color: #ffc93c; }
  .genres {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) { .genres { justify-content: center; } }
  .genre-tag {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.10);
    padding: 4px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; color: #c3c3cd;
  }
  .synopsis {
    font-size: 14px; line-height: 1.65; color: #c3c3cd;
    max-width: 720px;
  }
  @media (max-width: 720px) { .synopsis { font-size: 13px; } }

  /* ═══════════ TABS ═══════════ */
  .tabs {
    display: flex; gap: 4px;
    border-bottom: 1px solid var(--line);
    margin: 28px 0 24px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent; border: none;
    color: var(--muted);
    padding: 14px 20px;
    font-size: 14px; font-weight: 600;
    position: relative; white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: .15s; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: #e5e5ea; }
  .tab.active { color: #fff; border-bottom-color: var(--accent); }
  .tab .tab-spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .section { margin-bottom: 32px; }
  .section-title {
    font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
    margin-bottom: 12px;
  }

  /* pills */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    background: var(--card); border: 1px solid var(--line);
    color: #e5e5ea; padding: 10px 16px;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    transition: .15s;
  }
  .pill:hover { background: var(--card-2); border-color: #4a4a58; }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* season + episodes */
  .season-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .season-row label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .season-select {
    flex: 1; max-width: 320px;
    background: var(--card); border: 1px solid var(--line);
    color: #fff; padding: 10px 14px; border-radius: 10px;
    font-size: 14px; font-family: inherit; font-weight: 600;
    cursor: pointer; outline: none;
  }
  .season-select:focus { border-color: #4a4a58; }
  .episodes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px;
  }
  .ep-btn {
    background: var(--card); border: 1px solid var(--line);
    color: #e5e5ea; padding: 14px 6px;
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    transition: .15s; position: relative;
  }
  .ep-btn:hover { background: var(--card-2); border-color: #4a4a58; }
  .ep-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 0 0 3px rgba(229,9,20,.15);
  }

  /* play button */
  .play-row { display: flex; gap: 10px; align-items: center; margin-top: 20px; padding-top: 24px; border-top: 1px solid var(--line); }
  .play-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--accent); border: none; color: #fff;
    padding: 16px 32px; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    transition: .15s;
    box-shadow: 0 8px 24px rgba(229,9,20,.35);
  }
  .play-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
  .play-btn:active { transform: scale(.98); }

  /* states */
  .loading-block {
    display: flex; align-items: center; gap: 12px;
    padding: 40px 20px; color: var(--muted); font-size: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,.12);
    border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .unavailable-banner {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 20px 24px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-bd);
    border-radius: 12px;
    margin-top: 8px;
  }
  .unavailable-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(245,158,11,.15);
    display: flex; align-items: center; justify-content: center;
    color: var(--warn); font-size: 20px; font-weight: 800;
    flex-shrink: 0;
  }
  .unavailable-content { flex: 1; }
  .unavailable-title {
    font-size: 15px; font-weight: 700; color: #fcd34d;
    margin-bottom: 6px;
  }
  .unavailable-text {
    font-size: 13px; line-height: 1.6; color: #d0d0d8;
  }
  .unavailable-actions {
    margin-top: 12px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .unavailable-actions .btn {
    padding: 9px 16px; border-radius: 8px;
    background: var(--card-2); border: 1px solid var(--line);
    color: #e5e5ea; font-size: 12.5px; font-weight: 600;
    transition: .15s;
  }
  .unavailable-actions .btn:hover { background: #2e2e38; border-color: #4a4a58; }

  /* provider progress checklist */
  .provider-progress {
    display: flex; flex-direction: column; gap: 8px;
    padding: 20px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-top: 16px;
  }
  .provider-progress-title {
    font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
    margin-bottom: 4px;
  }
  .provider-progress-row {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: #c3c3cd;
  }
  .provider-progress-row .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .provider-progress-row.loading .status-dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .provider-progress-row.ok .status-dot { background: #22c55e; }
  .provider-progress-row.empty .status-dot { background: #6b7280; }
  .provider-progress-row.error .status-dot { background: var(--accent); }
  .provider-progress-row .status-text { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .provider-progress-row.ok .status-text { color: #22c55e; }
  .provider-progress-row.error .status-text { color: #fca5a5; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <button class="back-btn" id="backBtn" title="Back">←</button>
    <h1 id="pageTitle">Details</h1>
  </div>
  <div id="main">
    <div class="loading-block">
      <div class="spinner"></div>
      <div>Loading details…</div>
    </div>
  </div>
</div>

<script>
/* ═══════════ CONFIG ═══════════ */
const QS = new URLSearchParams(location.search);
const PROXY = location.origin;
const BASE = "https://officialmoviebox.com";

const TMDB_API_KEY = "09c7460bdc6319d6538d786919306438";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG_POSTER = "https://image.tmdb.org/t/p/w500";
const TMDB_IMG_BACKDROP = "https://image.tmdb.org/t/p/w1280";

const Q = {
  source:     QS.get("source") || "",
  detailPath: QS.get("detailPath") || "",
  subjectId:  QS.get("subjectId") || "",
  url:        QS.get("url") || "",
  title:      QS.get("title") || "",
  tmdbId:     QS.get("tmdbId") || "",
  mediaType:  QS.get("mediaType") || "",
  isSeries:   QS.get("isSeries") === "1" || QS.get("mediaType") === "tv",
};

/* ═══════════ SOURCE DETECTION ═══════════ */
function detectSource() {
  // Explicit source wins
  if (Q.source === "tmdb"    || Q.tmdbId)     return "tmdb";
  if (Q.source === "moviebox" || Q.detailPath) return "moviebox";
  if (Q.source === "hdhub")                    return "hdhub";
  if (Q.source === "drive")                    return "drive";
  // Guess from URL
  if (Q.url) {
    if (/hdhub4u/i.test(Q.url))     return "hdhub";
    if (/moviesdrive/i.test(Q.url)) return "drive";
    return "external";
  }
  return "";
}

/* ═══════════ STATE ═══════════ */
const state = {
  source: detectSource(),

  hero: {
    title:    Q.title || "Loading…",
    poster:   "",
    backdrop: "",
    overview: "",
    year:     "",
    rating:   "",
    runtime:  0,
    genres:   [],
    country:  "",
    isTV:     Q.isSeries,
    tmdbId:   Q.tmdbId,
    tmdbLoaded: false,
  },

  moviebox: {
    detailPath: Q.detailPath,
    subjectId:  Q.subjectId,
    data: null,
    status: "idle",  // idle | loading | ok | empty | error
    error: null,
    selectedDub: 0,
    selectedSe: 0,
    selectedEp: 1,
  },
  hdhub: {
    url: "",
    streams: [],
    status: "idle",
    error: null,
    selectedServer: 0,
  },
  drive: {
    url: "",
    streams: [],
    status: "idle",
    error: null,
    selectedServer: 0,
  },

  activeTab: "",
  bootError: null,
};

/* ═══════════ HELPERS ═══════════ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function imgUrl(v) {
  if (!v) return "";
  if (typeof v === "string") return v.startsWith("//") ? "https:" + v : v;
  return v.url || v.src || v.path || "";
}
function cleanTitle(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
function cleanForSearch(s) {
  return String(s || "")
    .replace(/\s*\((?:19|20)\d{2}\)\s*/g, " ")
    .replace(/\s*\[\s*[Ss]\d+.*?\]\s*/g, " ")
    .replace(/\s+Season\s+\d+.*$/i, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* ═══════════ TMDB ═══════════ */
async function tmdbFetch(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", "en-US");
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, String(v));
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
}

async function fetchTmdbDetails(tmdbId, mediaType) {
  if (!tmdbId) return null;
  try {
    const data = await tmdbFetch(`/${mediaType || "movie"}/${tmdbId}`);
    return {
      tmdbId:   data.id,
      title:    data.title || data.name || "",
      overview: data.overview || "",
      poster:   data.poster_path ? TMDB_IMG_POSTER + data.poster_path : "",
      backdrop: data.backdrop_path ? TMDB_IMG_BACKDROP + data.backdrop_path : "",
      year:     (data.release_date || data.first_air_date || "").slice(0, 4),
      rating:   data.vote_average ? data.vote_average.toFixed(1) : "",
      runtime:  data.runtime || (data.episode_run_time && data.episode_run_time[0]) || 0,
      genres:   (data.genres || []).map(g => g.name),
      isTV:     mediaType === "tv",
      country:  (data.production_countries && data.production_countries[0]?.name) || "",
    };
  } catch (e) {
    console.warn("[tmdb] details failed:", e.message);
    return null;
  }
}

async function searchTmdbByTitle(title, isTVHint) {
  if (!title) return null;
  try {
    const data = await tmdbFetch("/search/multi", { query: title, page: 1, include_adult: "false" });
    const results = (data.results || []).filter(r => r.media_type === "movie" || r.media_type === "tv");
    if (!results.length) return null;

    const needle = cleanTitle(title);
    const yearMatch = String(title).match(/\b(19\d{2}|20\d{2})\b/);
    const targetYear = yearMatch ? yearMatch[1] : null;

    let best = null, bestScore = 0;
    for (const r of results) {
      const name = r.title || r.name || "";
      const norm = cleanTitle(name);
      let score = 0;
      if (norm === needle) score = 100;
      else if (norm.startsWith(needle + " ") || norm.endsWith(" " + needle)) score = 85;
      else if (norm.includes(needle) || needle.includes(norm)) score = 60;
      else continue;

      if (targetYear) {
        const relYear = (r.release_date || r.first_air_date || "").slice(0, 4);
        if (relYear === targetYear) score += 30;
      }
      if (r.popularity > 20) score += 5;
      if (bestScore === 0 && isTVHint !== undefined && r.media_type === (isTVHint ? "tv" : "movie")) score += 5;

      if (score > bestScore) { bestScore = score; best = r; }
    }
    return best && bestScore >= 55
      ? { id: best.id, mediaType: best.media_type, title: best.title || best.name }
      : null;
  } catch (e) {
    console.warn("[tmdb] search failed:", e.message);
    return null;
  }
}

/* ═══════════ NUXT DECODER ═══════════ */
const DEVALUE_WRAPPERS = {
  ShallowReactive: v => v, Reactive: v => v, Ref: v => v,
  ShallowRef: v => v, EmptyRef: () => undefined, EmptyShallowRef: () => undefined,
  Set: v => v, Map: v => v, Date: v => v, RegExp: v => v, BigInt: v => v,
  "null": () => null, "undefined": () => undefined, NaN: () => NaN,
  Infinity: () => Infinity, "-Infinity": () => -Infinity,
};
function devalueResolve(arr) {
  const cache = new Map();
  function go(ref) {
    if (ref === null || ref === undefined) return ref;
    if (typeof ref !== "number") return ref;
    if (cache.has(ref)) return cache.get(ref);
    const v = arr[ref];
    if (v === null || v === undefined || typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      cache.set(ref, v); return v;
    }
    if (Array.isArray(v)) {
      if (v.length >= 1 && typeof v[0] === "string" && DEVALUE_WRAPPERS[v[0]]) {
        const inner = v.length > 1 ? go(v[1]) : undefined;
        const wrapped = DEVALUE_WRAPPERS[v[0]](inner);
        cache.set(ref, wrapped); return wrapped;
      }
      const out = []; cache.set(ref, out);
      for (const item of v) out.push(go(item));
      return out;
    }
    if (typeof v === "object") {
      const out = {}; cache.set(ref, out);
      for (const k of Object.keys(v)) out[k] = go(v[k]);
      return out;
    }
    cache.set(ref, v); return v;
  }
  return go(0);
}
function extractNuxt3Payload(html) {
  const m = html.match(/<script[^>]*id=["']__NUXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try {
    const arr = JSON.parse(m[1]);
    if (!Array.isArray(arr)) return null;
    return devalueResolve(arr);
  } catch (_) { return null; }
}
function findDetailRoot(root) {
  const visited = new WeakSet(); let found = null;
  function walk(node, depth) {
    if (found || depth > 60 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (node.subject && node.subject.subjectId && (node.resource !== undefined || node.metadata !== undefined)) {
      found = node; return;
    }
    if (Array.isArray(node)) { for (const item of node) { walk(item, depth + 1); if (found) return; } return; }
    for (const k of Object.keys(node)) { walk(node[k], depth + 1); if (found) return; }
  }
  walk(root, 0); return found;
}
function findSubjects(root) {
  const seen = new Set(), out = [], visited = new WeakSet();
  function walk(node, depth) {
    if (depth > 40 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (Array.isArray(node)) { for (const item of node) walk(item, depth + 1); return; }
    if (typeof node.detailPath === "string" && node.detailPath.length > 0 &&
        typeof node.title === "string" && node.title.length > 0 &&
        node.subjectId !== undefined && !seen.has(node.detailPath)) {
      seen.add(node.detailPath);
      out.push({
        title: node.title,
        detailPath: node.detailPath,
        subjectId: String(node.subjectId || ""),
        isTV: Number(node.subjectType) === 2,
        hasResource: node.hasResource !== false,
      });
    }
    for (const k of Object.keys(node)) walk(node[k], depth + 1);
  }
  walk(root, 0);
  return out.filter(s => s.hasResource);
}
function normalizeSeasons(rawSeasons, isSeries) {
  if (!Array.isArray(rawSeasons) || !rawSeasons.length) {
    return [{ se: 0, title: "Movie", episodes: [{ ep: 1 }] }];
  }
  const out = [];
  for (const s of rawSeasons) {
    const se = Number(s.se ?? (isSeries ? 1 : 0));
    const resList = Array.isArray(s.resolutions) ? s.resolutions : [];
    let eps = [];
    if (s.allEp) eps = String(s.allEp).split(",").map(n => Number(n.trim())).filter(n => n > 0);
    else if (s.maxEp) eps = Array.from({ length: Number(s.maxEp) }, (_, i) => i + 1);
    if (!eps.length && resList.length) eps = [...new Set(resList.map(r => Number(r.epNum) || 1))].sort((a, b) => a - b);
    if (!eps.length) eps = [1];
    out.push({
      se: isSeries ? (se || 1) : 0,
      title: s.title || (isSeries ? "Season " + (se || 1) : "Movie"),
      episodes: eps.map(ep => ({ ep })),
    });
  }
  return out;
}

/* ═══════════ SEARCHERS ═══════════ */
async function searchMovieBox(title, isTV) {
  if (!title) return null;
  try {
    const searchUrl = BASE + "/search?q=" + encodeURIComponent(title);
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(searchUrl) + "&referer=" + encodeURIComponent(BASE + "/"));
    if (!res.ok) return null;
    const resolved = extractNuxt3Payload(await res.text());
    if (!resolved) return null;
    const subjects = findSubjects(resolved);
    const needle = cleanTitle(title);
    let best = null, bestScore = 0;
    for (const s of subjects) {
      if (isTV !== undefined && s.isTV !== isTV) continue;
      const norm = cleanTitle(s.title);
      let score = 0;
      if (norm === needle) score = 100;
      else if (norm.startsWith(needle + " ") || norm.endsWith(" " + needle)) score = 85;
      else if (norm.includes(needle) || needle.includes(norm)) score = 60;
      else continue;
      if (score > bestScore) { bestScore = score; best = s; }
    }
    return best && bestScore >= 40 ? best : null;
  } catch (e) {
    console.warn("[moviebox search]", e);
    return null;
  }
}

async function searchProvider(pid, title) {
  if (!title) return null;
  try {
    const res = await fetch(PROXY + "/providers/" + pid + "/search?q=" + encodeURIComponent(title));
    if (!res.ok) return null;
    const data = await res.json();
    const results = data.results || [];
    const needle = cleanTitle(title);
    let best = null, bestScore = 0;
    for (const r of results) {
      const norm = cleanTitle(r.title);
      let score = 0;
      if (norm === needle) score = 100;
      else if (norm.startsWith(needle + " ") || norm.endsWith(" " + needle)) score = 85;
      else if (norm.includes(needle) || needle.includes(norm)) score = 60;
      else continue;
      if (score > bestScore) { bestScore = score; best = r; }
    }
    return best && bestScore >= 40 ? best.url : null;
  } catch (e) {
    console.warn("[search " + pid + "]", e);
    return null;
  }
}

/* ═══════════ PROVIDER LOADERS ═══════════ */
async function loadMovieBox(detailPath, subjectId) {
  state.moviebox.status = "loading";
  state.moviebox.detailPath = detailPath;
  state.moviebox.subjectId = subjectId || "";
  render();

  try {
    const realUrl = BASE + "/moviesDetail/" + detailPath;
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(realUrl) + "&referer=" + encodeURIComponent(BASE + "/"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    const resolved = extractNuxt3Payload(html);
    if (!resolved) throw new Error("No Nuxt payload");
    const detail = findDetailRoot(resolved);
    if (!detail) throw new Error("No subject");

    const subject = detail.subject;
    const resource = detail.resource || {};
    const isSeries = Number(subject.subjectType) === 2;

    state.moviebox.data = {
      subjectId: String(subject.subjectId || subjectId || ""),
      detailPath: subject.detailPath || detailPath,
      title: subject.title || "",
      description: subject.description || "",
      cover: imgUrl(subject.cover),
      isSeries,
      dubs: (Array.isArray(subject.dubs) ? subject.dubs : []).filter(d => d && d.subjectId),
      seasons: normalizeSeasons(resource.seasons || [], isSeries),
    };
    state.moviebox.selectedSe = state.moviebox.data.seasons[0]?.se ?? 0;
    state.moviebox.selectedEp = state.moviebox.data.seasons[0]?.episodes?.[0]?.ep ?? 1;
    state.moviebox.status = "ok";

    // If hero is still using the URL title, upgrade it with MovieBox's title
    if (state.hero.title === Q.title || !state.hero.title) {
      state.hero.title = state.moviebox.data.title;
      if (!state.hero.poster && state.moviebox.data.cover) state.hero.poster = state.moviebox.data.cover;
      if (!state.hero.overview && state.moviebox.data.description) state.hero.overview = state.moviebox.data.description;
    }
  } catch (e) {
    console.warn("[moviebox]", e);
    state.moviebox.error = e.message;
    state.moviebox.status = "error";
  }
  render();
}

async function loadExternal(source, url) {
  if (!url) { state[source].status = "empty"; return; }
  state[source].url = url;
  state[source].status = "loading";
  render();

  const referer = source === "hdhub" ? "https://new8.hdhub4u.cl/" : "https://new3.moviesdrive.beer/";

  // Fetch og:title, og:image, og:description
  try {
    const res = await fetch(PROXY + "/?url=" + encodeURIComponent(url) + "&referer=" + encodeURIComponent(referer) + "&provider=" + source);
    if (res.ok) {
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const ogTitle = doc.querySelector('meta[property="og:title"]')?.content
        || doc.querySelector("h1.entry-title, h1.page-title, h1")?.textContent || "";
      const ogImage = doc.querySelector('meta[property="og:image"]')?.content || "";
      const ogDesc = doc.querySelector('meta[property="og:description"]')?.content || "";

      if (ogTitle && (!state.hero.title || state.hero.title === Q.title || state.hero.title === "Loading…")) {
        state.hero.title = ogTitle.trim();
      }
      if (ogImage && !state.hero.poster) state.hero.poster = ogImage;
      if (ogDesc && !state.hero.overview) state.hero.overview = ogDesc;

      if (/\(Season\s*\d|S\d{2}E\d{2}|Complete\s*Series|Web\s*Series/i.test(ogTitle)) {
        state.hero.isTV = true;
      }
    }
  } catch (e) { console.warn("[ext meta " + source + "]", e); }

  // Fetch streams
  try {
    const res = await fetch(PROXY + "/providers/" + source + "/streams?url=" + encodeURIComponent(url));
    if (res.ok) {
      const data = await res.json();
      state[source].streams = (data.streams || []).filter(s => s.url);
      state[source].status = state[source].streams.length ? "ok" : "empty";
    } else {
      state[source].status = "empty";
    }
  } catch (e) {
    console.warn("[ext streams " + source + "]", e);
    state[source].error = e.message;
    state[source].status = "error";
  }
  render();
}

/* ═══════════ HERO ENRICHMENT FROM TMDB ═══════════ */
async function enrichHeroWithTmdb() {
  if (state.hero.tmdbLoaded) return;

  let meta = null;

  if (Q.tmdbId) {
    meta = await fetchTmdbDetails(Q.tmdbId, Q.mediaType || (state.hero.isTV ? "tv" : "movie"));
  }

  if (!meta && state.hero.title && state.hero.title !== "Loading…") {
    const match = await searchTmdbByTitle(cleanForSearch(state.hero.title), state.hero.isTV);
    if (match) {
      meta = await fetchTmdbDetails(match.id, match.mediaType);
    }
  }

  if (meta) {
    state.hero = {
      title:    meta.title || state.hero.title,
      poster:   meta.poster || state.hero.poster,
      backdrop: meta.backdrop || state.hero.backdrop,
      overview: meta.overview || state.hero.overview,
      year:     meta.year || state.hero.year,
      rating:   meta.rating || state.hero.rating,
      runtime:  meta.runtime || state.hero.runtime,
      genres:   meta.genres || state.hero.genres,
      country:  meta.country || state.hero.country,
      isTV:     meta.isTV !== undefined ? meta.isTV : state.hero.isTV,
      tmdbId:   meta.tmdbId || state.hero.tmdbId,
      tmdbLoaded: true,
    };
    render();
  }
}

/* ═══════════ RENDER ═══════════ */
function getAvailableProviders() {
  const out = [];
  if (state.moviebox.data) out.push("moviebox");
  if (state.hdhub.streams.length > 0) out.push("hdhub");
  if (state.drive.streams.length > 0) out.push("drive");
  return out;
}

function getAllTried() {
  const mbDone = state.moviebox.status === "ok" || state.moviebox.status === "empty" || state.moviebox.status === "error";
  const hdDone = state.hdhub.status === "ok" || state.hdhub.status === "empty" || state.hdhub.status === "error";
  const drDone = state.drive.status === "ok" || state.drive.status === "empty" || state.drive.status === "error";
  return mbDone && hdDone && drDone;
}

function renderHero() {
  const h = state.hero;
  const initial = (h.title || "?").charAt(0).toUpperCase();

  const metaBits = [];
  if (h.year) metaBits.push(`<span>${escapeHtml(h.year)}</span>`);
  metaBits.push(`<span class="badge">${h.isTV ? "Series" : "Movie"}</span>`);
  if (h.runtime) metaBits.push(`<span>${h.runtime}m</span>`);
  if (h.rating) metaBits.push(`<span class="rating">★ ${escapeHtml(h.rating)}</span>`);
  if (h.country) metaBits.push(`<span>${escapeHtml(h.country)}</span>`);

  const genresHtml = h.genres && h.genres.length
    ? `<div class="genres">${h.genres.map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join("")}</div>`
    : "";

  const posterHtml = h.poster
    ? `<img src="${escapeHtml(h.poster)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="fallback" style="display:none">${initial}</div>`
    : `<div class="fallback">${initial}</div>`;

  return `
    <div class="hero">
      ${h.backdrop ? `<div class="hero-backdrop" style="background-image:url('${escapeHtml(h.backdrop)}')"></div>` : ''}
      <div class="hero-inner">
        <div class="poster">${posterHtml}</div>
        <div class="info">
          <h1>${escapeHtml(h.title)}</h1>
          <div class="meta">${metaBits.join("")}</div>
          ${genresHtml}
          ${h.overview ? `<p class="synopsis">${escapeHtml(h.overview)}</p>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderProviderProgress() {
  const providers = [
    { id: "moviebox", name: "MovieBox" },
    { id: "hdhub",    name: "hdhub4u" },
    { id: "drive",    name: "moviesDrive" },
  ];

  const rows = providers.map(p => {
    const s = state[p.id];
    let cls = "loading", text = "Checking…";
    if (s.status === "ok")    { cls = "ok";    text = "Available"; }
    else if (s.status === "empty") { cls = "empty"; text = "Not found"; }
    else if (s.status === "error") { cls = "error"; text = "Error"; }
    else if (s.status === "idle")  { cls = "loading"; text = "Waiting…"; }
    return `
      <div class="provider-progress-row ${cls}">
        <span class="status-dot"></span>
        <span>${escapeHtml(p.name)}</span>
        <span class="status-text">${text}</span>
      </div>
    `;
  }).join("");

  return `
    <div class="provider-progress">
      <div class="provider-progress-title">Checking stream availability</div>
      ${rows}
    </div>
  `;
}

function renderTabs(providers) {
  const labels = { moviebox: "MovieBox", hdhub: "hdhub4u", drive: "moviesDrive" };
  return `<nav class="tabs">${providers.map(id => {
    const isActive = id === state.activeTab;
    return `<button class="tab ${isActive ? "active" : ""}" data-tab="${id}">${escapeHtml(labels[id])}</button>`;
  }).join("")}</nav>`;
}

function renderMovieBoxTab() {
  const m = state.moviebox;
  if (!m.data) return `<div class="loading-block"><div class="spinner"></div><div>Loading…</div></div>`;

  const d = m.data;
  const parts = [];

  if (d.dubs.length >= 1) {
    parts.push(`<div class="section"><div class="section-title">Audio</div><div class="pills">
      ${d.dubs.map((dub, i) => `
        <button class="pill ${i === m.selectedDub ? "active" : ""}" data-action="pick-dub" data-dub="${i}">
          ${escapeHtml(dub.lanName || dub.lan || "Audio " + (i + 1))}
        </button>`).join("")}
    </div></div>`);
  }

  if (d.isSeries && d.seasons.length > 0) {
    const season = d.seasons.find(s => s.se === m.selectedSe) || d.seasons[0];
    const seasonRow = d.seasons.length > 1 ? `
      <div class="season-row">
        <label>Season</label>
        <select class="season-select" id="seasonSelect">
          ${d.seasons.map(s => `<option value="${s.se}" ${s.se === m.selectedSe ? "selected" : ""}>${escapeHtml(s.title)}</option>`).join("")}
        </select>
      </div>` : "";

    const epGrid = `<div class="episodes-grid">
      ${season.episodes.map(e => {
        const isActive = season.se === m.selectedSe && e.ep === m.selectedEp;
        return `<button class="ep-btn ${isActive ? "active" : ""}" data-action="pick-ep" data-se="${season.se}" data-ep="${e.ep}">
          E${String(e.ep).padStart(2, "0")}
        </button>`;
      }).join("")}
    </div>`;

    parts.push(`<div class="section"><div class="section-title">Episodes</div>${seasonRow}${epGrid}</div>`);
  }

  const playText = d.isSeries
    ? `▶ Play S${m.selectedSe}E${String(m.selectedEp).padStart(2, "0")}`
    : `▶ Play Movie`;
  parts.push(`<div class="play-row"><button class="play-btn" data-action="play-moviebox">${playText}</button></div>`);

  return parts.join("");
}

function renderServerTab(provider) {
  const s = state[provider];
  if (!s.streams.length) return `<div class="loading-block">No streams</div>`;

  return `
    <div class="section"><div class="section-title">Server</div><div class="pills">
      ${s.streams.map((st, i) => `
        <button class="pill ${i === s.selectedServer ? "active" : ""}" data-action="pick-server" data-provider="${provider}" data-server="${i}">
          ${escapeHtml(st.label || ("Server " + (i + 1)))}
          ${st.quality && st.quality !== "Auto" ? " · " + escapeHtml(st.quality) : ""}
        </button>`).join("")}
    </div></div>
    <div class="play-row">
      <button class="play-btn" data-action="play-server" data-provider="${provider}">▶ Play</button>
    </div>`;
}

function render() {
  const main = document.getElementById("main");

  const available = getAvailableProviders();
  const allTried = getAllTried();

  // Set active tab
  if (!state.activeTab || !available.includes(state.activeTab)) {
    if (available.length > 0) {
      if (state.source && available.includes(state.source)) state.activeTab = state.source;
      else state.activeTab = available[0];
    }
  }

  const parts = [];
  parts.push(renderHero());

  if (state.bootError) {
    parts.push(`
      <div class="unavailable-banner">
        <div class="unavailable-icon">⚠</div>
        <div class="unavailable-content">
          <div class="unavailable-title">${escapeHtml(state.bootError)}</div>
          <div class="unavailable-text">Open this page from the catalog, or try again.</div>
          <div class="unavailable-actions">
            <button class="btn" onclick="location.href='index.html'">Back to catalog</button>
          </div>
        </div>
      </div>
    `);
  } else if (available.length > 0) {
    // Show tabs
    parts.push(renderTabs(available));
    for (const id of available) {
      const isActive = id === state.activeTab;
      const content = id === "moviebox" ? renderMovieBoxTab() : renderServerTab(id);
      parts.push(`<div class="tab-content ${isActive ? "active" : ""}" data-tab-content="${id}">${content}</div>`);
    }
    // If not all tried yet, still show progress below
    if (!allTried) {
      parts.push(renderProviderProgress());
    }
  } else if (!allTried) {
    // Still loading, no tabs yet
    parts.push(renderProviderProgress());
  } else {
    // All tried, nothing found
    parts.push(`
      <div class="unavailable-banner">
        <div class="unavailable-icon">⚠</div>
        <div class="unavailable-content">
          <div class="unavailable-title">No streams available</div>
          <div class="unavailable-text">
            We checked MovieBox, hdhub4u, and moviesDrive — this title isn't currently available on any provider.
            Try a different title, or check back later.
          </div>
          <div class="unavailable-actions">
            <button class="btn" id="retryAll">Retry all providers</button>
            <button class="btn" onclick="location.href='index.html'">Back to catalog</button>
          </div>
        </div>
      </div>
    `);
  }

  main.innerHTML = parts.join("");
  bindEvents();
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.activeTab = tab.dataset.tab;
      render();
    });
  });

  const seasonSelect = document.getElementById("seasonSelect");
  if (seasonSelect) seasonSelect.addEventListener("change", (e) => {
    const se = Number(e.target.value);
    state.moviebox.selectedSe = se;
    const season = state.moviebox.data.seasons.find(s => s.se === se);
    state.moviebox.selectedEp = season?.episodes?.[0]?.ep || 1;
    render();
  });

  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "pick-dub") {
        state.moviebox.selectedDub = Number(btn.dataset.dub);
        render();
      } else if (a === "pick-ep") {
        state.moviebox.selectedSe = Number(btn.dataset.se);
        state.moviebox.selectedEp = Number(btn.dataset.ep);
        playMovieBox();
      } else if (a === "pick-server") {
        const p = btn.dataset.provider;
        state[p].selectedServer = Number(btn.dataset.server);
        render();
      } else if (a === "play-moviebox") {
        playMovieBox();
      } else if (a === "play-server") {
        playServer(btn.dataset.provider);
      }
    });
  });

  const retryAll = document.getElementById("retryAll");
  if (retryAll) retryAll.addEventListener("click", () => boot(true));
}

/* ═══════════ PLAY ACTIONS ═══════════ */
function playMovieBox() {
  const m = state.moviebox;
  if (!m.data) return;
  const dub = m.data.dubs[m.selectedDub] || {
    subjectId: m.data.subjectId, detailPath: m.data.detailPath, lanName: "Original Audio",
  };
  const params = new URLSearchParams({
    detailPath: dub.detailPath || m.data.detailPath,
    mainDetailPath: m.data.detailPath,
    subjectId: dub.subjectId || m.data.subjectId,
    isSeries: m.data.isSeries ? "1" : "0",
    title: state.hero.title || m.data.title,
    subtitle: "",
    lang: dub.lanName || "Original Audio",
  });
  if (m.data.isSeries) {
    params.set("se", String(m.selectedSe || m.data.seasons[0]?.se || 1));
    params.set("ep", String(m.selectedEp || 1));
  }
  location.href = "player.html?" + params.toString();
}

function playServer(provider) {
  const s = state[provider];
  const stream = s.streams[s.selectedServer] || s.streams[0];
  if (!stream?.url) return;
  const referer = provider === "hdhub" ? "https://new8.hdhub4u.cl/" : "https://new3.moviesdrive.beer/";
  const proxied = PROXY + "/?url=" + encodeURIComponent(stream.url)
                + "&referer=" + encodeURIComponent(referer)
                + "&provider=" + provider;
  const title = state.hero.title || "Untitled";
  const subtitle = (stream.label || "") + (stream.quality && stream.quality !== "Auto" ? " · " + stream.quality : "");
  const params = new URLSearchParams({ streamUrl: proxied, title, subtitle });
  location.href = "player.html?" + params.toString();
}

/* ═══════════ BOOT DISPATCHER ═══════════ */
async function boot(retry = false) {
  if (retry) {
    state.moviebox = { ...state.moviebox, data: null, status: "idle", error: null };
    state.hdhub   = { ...state.hdhub,   streams: [], status: "idle", error: null, url: "" };
    state.drive   = { ...state.drive,   streams: [], status: "idle", error: null, url: "" };
    state.activeTab = "";
  }

  document.getElementById("pageTitle").textContent = state.hero.title || "Details";
  render();

  const source = state.source;

  if (source === "tmdb") {
    await bootFromTmdb();
  } else if (source === "moviebox") {
    await bootFromMovieBox();
  } else if (source === "hdhub" || source === "drive") {
    await bootFromExternal(source);
  } else if (source === "external") {
    // Guess by URL
    if (/hdhub4u/i.test(Q.url)) await bootFromExternal("hdhub");
    else if (/moviesdrive/i.test(Q.url)) await bootFromExternal("drive");
    else state.bootError = "Cannot determine source";
  } else {
    state.bootError = "No source specified";
  }

  render();
}

async function bootFromTmdb() {
  // 1. Fetch TMDB details (fast)
  if (Q.tmdbId) {
    const meta = await fetchTmdbDetails(Q.tmdbId, Q.mediaType || "movie");
    if (meta) {
      state.hero = {
        title:    meta.title || state.hero.title,
        poster:   meta.poster || state.hero.poster,
        backdrop: meta.backdrop || state.hero.backdrop,
        overview: meta.overview || state.hero.overview,
        year:     meta.year,
        rating:   meta.rating,
        runtime:  meta.runtime,
        genres:   meta.genres,
        country:  meta.country,
        isTV:     meta.isTV,
        tmdbId:   meta.tmdbId,
        tmdbLoaded: true,
      };
      render();
    }
  }

  const searchTitle = cleanForSearch(state.hero.title);
  if (!searchTitle) {
    state.moviebox.status = state.hdhub.status = state.drive.status = "empty";
    render();
    return;
  }

  // 2. Search all 3 providers in parallel
  state.moviebox.status = state.hdhub.status = state.drive.status = "loading";
  render();

  const [mbMatch, hdUrl, drUrl] = await Promise.all([
    searchMovieBox(searchTitle, state.hero.isTV),
    searchProvider("hdhub", searchTitle),
    searchProvider("drive", searchTitle),
  ]);

  // 3. Load streams for each match
  await Promise.all([
    (async () => {
      if (mbMatch) await loadMovieBox(mbMatch.detailPath, mbMatch.subjectId);
      else { state.moviebox.status = "empty"; render(); }
    })(),
    (async () => {
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);
}

async function bootFromMovieBox() {
  if (!Q.detailPath) {
    state.bootError = "Missing detailPath";
    return;
  }

  state.moviebox.status = "loading";
  render();

  await loadMovieBox(Q.detailPath, Q.subjectId);

  // Cross-search others after MovieBox loads
  const title = cleanForSearch(state.moviebox.data?.title || state.hero.title);
  if (!title) {
    state.hdhub.status = state.drive.status = "empty";
    render();
    return;
  }

  state.hdhub.status = state.drive.status = "loading";
  render();

  const [hdUrl, drUrl] = await Promise.all([
    searchProvider("hdhub", title),
    searchProvider("drive", title),
  ]);

  await Promise.all([
    (async () => {
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);

  // Enrich hero with TMDB in background
  enrichHeroWithTmdb();
}

async function bootFromExternal(source) {
  if (!Q.url) {
    state.bootError = "Missing url";
    return;
  }

  state[source].status = "loading";
  render();

  await loadExternal(source, Q.url);

  // Enrich hero with TMDB first (so title matches are better)
  await enrichHeroWithTmdb();

  const title = cleanForSearch(state.hero.title);
  if (!title) {
    if (source !== "moviebox") state.moviebox.status = "empty";
    if (source !== "hdhub")   state.hdhub.status = "empty";
    if (source !== "drive")   state.drive.status = "empty";
    render();
    return;
  }

  // Cross-search others
  const toLoad = [];
  if (source !== "moviebox") state.moviebox.status = "loading";
  if (source !== "hdhub")   state.hdhub.status = "loading";
  if (source !== "drive")   state.drive.status = "loading";
  render();

  const [mbMatch, hdUrl, drUrl] = await Promise.all([
    source !== "moviebox" ? searchMovieBox(title, state.hero.isTV) : Promise.resolve(null),
    source !== "hdhub"    ? searchProvider("hdhub", title) : Promise.resolve(null),
    source !== "drive"    ? searchProvider("drive", title) : Promise.resolve(null),
  ]);

  await Promise.all([
    (async () => {
      if (source === "moviebox") return;
      if (mbMatch) await loadMovieBox(mbMatch.detailPath, mbMatch.subjectId);
      else { state.moviebox.status = "empty"; render(); }
    })(),
    (async () => {
      if (source === "hdhub") return;
      if (hdUrl) await loadExternal("hdhub", hdUrl);
      else { state.hdhub.status = "empty"; render(); }
    })(),
    (async () => {
      if (source === "drive") return;
      if (drUrl) await loadExternal("drive", drUrl);
      else { state.drive.status = "empty"; render(); }
    })(),
  ]);
}

/* ═══════════ INIT ═══════════ */
document.getElementById("backBtn").addEventListener("click", () => {
  if (history.length > 1) history.back();
  else location.href = "index.html";
});

boot();
</script>
