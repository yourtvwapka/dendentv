<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Browse — Movies & TV</title>

<style>
  :root{
    --accent:#e50914; --accent-2:#f6121d;
    --bg:#000; --bg-2:#0a0a0d;
    --card:#1e1e25; --card-2:#26262f;
    --line:#2a2a33; --text:#f5f5f7; --muted:#8a8a94;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
  img{display:block}
  button{font-family:inherit;color:inherit;cursor:pointer}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:16px;
    padding:14px 22px;
    background:linear-gradient(180deg,rgba(0,0,0,.95) 60%,rgba(0,0,0,.6));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.3px;color:#fff;white-space:nowrap;flex-shrink:0}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .search-wrap{flex:1;max-width:640px;position:relative;display:flex;align-items:center}
  .search-wrap svg.search-ico{position:absolute;left:14px;width:18px;height:18px;fill:var(--muted);pointer-events:none;transition:fill .15s}
  .search-wrap:focus-within svg.search-ico{fill:#fff}
  #searchInput{width:100%;height:44px;padding:0 40px 0 44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff;border-radius:var(--radius);font-size:14px;font-family:inherit;outline:none;transition:border .15s,background .15s}
  #searchInput::placeholder{color:var(--muted)}
  #searchInput:focus{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.10)}
  #searchClear{position:absolute;right:8px;width:30px;height:30px;border-radius:6px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  #searchClear:hover{background:rgba(255,255,255,.08);color:#fff}
  #searchClear[hidden]{display:none}

  main{padding:24px 22px 120px;max-width:1600px;margin:0 auto}
  section[hidden]{display:none!important}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 14px}
  .section-head:first-child{margin-top:0}
  .section-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .section-head .hint{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 16px;scroll-snap-type:x proximity;scrollbar-width:thin}
  .row::-webkit-scrollbar{height:8px}
  .row::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:4px}
  .row::-webkit-scrollbar-thumb:hover{background:#3a3a44}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px}

  .card{display:flex;flex-direction:column;gap:8px;background:transparent;border:none;padding:0;text-align:left;color:inherit;scroll-snap-align:start;flex-shrink:0;transition:transform .15s ease;-webkit-tap-highlight-color:transparent}
  .row .card{width:168px}
  .card:hover{transform:translateY(-3px)}
  .card:active{transform:translateY(-1px) scale(.98)}

  .poster{position:relative;width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#1a1a20 0%,#0a0a0d 100%);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  .poster img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
  .card:hover .poster img{transform:scale(1.05)}
  .poster .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:rgba(255,255,255,.22)}
  .poster .badge,.poster .provider-tag{position:absolute;padding:2px 6px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px)}
  .poster .badge{top:6px;left:6px;background:rgba(0,0,0,.72);color:#fff}
  .poster .provider-tag{bottom:6px;right:6px;background:rgba(229,9,20,.82);color:#fff;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poster .provider-tag.neutral{background:rgba(0,0,0,.72)}

  .card-title{font-size:13px;font-weight:600;line-height:1.3;color:#e5e5ea;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px}

  .spinner-wrap{display:flex;align-items:center;justify-content:center;padding:70px 20px;gap:12px;color:var(--muted);font-size:13px}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:70px 24px;color:var(--muted);font-size:14px}
  .empty strong{color:#fff;font-weight:700}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 16px;margin-bottom:14px}
  .filter-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#e5e5ea;border-radius:999px;font-size:13px;font-weight:700;transition:.15s;-webkit-tap-highlight-color:transparent}
  .filter-pill:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.20)}
  .filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.35)}
  .filter-pill .count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;background:rgba(255,255,255,.15);border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .filter-pill.active .count{background:rgba(0,0,0,.25)}
  .filter-pill .provider-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .filter-pill[data-provider="__moviebox"] .provider-dot{background:#e50914}
  .filter-pill[data-provider="hdhub"] .provider-dot{background:#22c55e}
  .filter-pill[data-provider="drive"] .provider-dot{background:#3b82f6}
  .filter-pill.active .provider-dot{background:#fff}

  /* sentinel + end message */
  .sentinel{grid-column:1/-1;height:1px;pointer-events:none;opacity:0}
  .end-msg{grid-column:1/-1;text-align:center;padding:36px 20px 20px;color:var(--muted);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;user-select:none}
  .end-msg[hidden]{display:none}
  .search-loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:30px;gap:12px;color:var(--muted);font-size:12.5px}
  .search-loading[hidden]{display:none}

  /* page bar (search only) */
  .page-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(23,23,28,.92);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:150;transition:opacity .18s,transform .18s}
  .page-bar[hidden]{display:none}
  .page-bar.fade{opacity:.35}
  .page-bar.fade:hover{opacity:1}
  .page-btn{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#e5e5ea;font-size:20px;line-height:1;font-weight:600;border-radius:999px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .page-btn:hover:not(:disabled){background:rgba(255,255,255,.10);color:#fff}
  .page-btn:active:not(:disabled){transform:scale(.92)}
  .page-btn:disabled{opacity:.28;cursor:default}
  .page-label{font-size:12.5px;font-weight:700;color:#e5e5ea;font-variant-numeric:tabular-nums;min-width:70px;text-align:center;padding:0 6px;user-select:none}
  .page-label .page-cur{color:#fff}
  .page-label .page-sep{color:#6b7280;margin:0 3px}
  .page-label .page-total{color:var(--muted)}
  .page-bar .jump-input{width:52px;height:34px;flex:none;background:#101014;border:1px solid var(--line);color:#e5e5ea;font-size:13px;font-weight:600;border-radius:999px;text-align:center;outline:none;font-variant-numeric:tabular-nums;padding:0 4px;-moz-appearance:textfield}
  .page-bar .jump-input:focus{border-color:var(--accent)}
  .page-bar .jump-input::-webkit-outer-spin-button,
  .page-bar .jump-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .page-bar .jump-btn{height:34px;padding:0 12px;flex:none;background:var(--card-2);border:1px solid var(--line);color:#e5e5ea;font-size:12px;font-weight:700;border-radius:999px;cursor:pointer;transition:.15s;letter-spacing:.3px}
  .page-bar .jump-btn:hover{background:#26262f;border-color:#4a4a58;color:#fff}

  .toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);padding:11px 18px;border-radius:10px;background:rgba(20,20,24,.96);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .topbar{padding:12px 14px;gap:10px}
    .brand{font-size:15px}
    .brand .dot{width:8px;height:8px}
    #searchInput{height:40px;font-size:13.5px;padding:0 36px 0 40px}
    main{padding:16px 14px 110px}
    .section-head h2{font-size:17px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 10px}
    .row .card{width:132px}
    .row{gap:10px}
    .filter-pill{padding:8px 12px;font-size:12px}
    .filter-pill .count{min-width:18px;height:18px;padding:0 5px;font-size:10px}
    .page-bar{bottom:14px;padding:5px 6px;gap:4px}
    .page-btn{width:32px;height:32px;font-size:19px}
    .page-label{min-width:58px;font-size:12px;padding:0 4px}
    .page-bar .jump-input{width:44px;height:32px;font-size:12px}
    .page-bar .jump-btn{height:32px;padding:0 10px;font-size:11px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Browse</div>
  <div class="search-wrap">
    <svg class="search-ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="searchInput" type="search" placeholder="Search movies and TV shows across all providers…" autocomplete="off" />
    <button id="searchClear" hidden aria-label="Clear">✕</button>
  </div>
</header>

<main>
  <section id="browseSection">
    <div class="section-head">
      <h2>Trending Movies</h2>
      <span class="hint" id="hintMovies">Popular right now</span>
    </div>
    <div class="row" id="rowMovies">
      <div class="spinner-wrap"><div class="spinner"></div>Loading…</div>
    </div>

    <div class="section-head">
      <h2>Trending TV Shows</h2>
      <span class="hint" id="hintTV"></span>
    </div>
    <div class="row" id="rowTV">
      <div class="spinner-wrap"><div class="spinner"></div>Loading…</div>
    </div>

    <div class="section-head">
      <h2>All providers</h2>
      <span class="hint" id="providerHint">—</span>
    </div>
    <div class="empty" id="providerList">Loading…</div>
  </section>

  <section id="searchSection" hidden>
    <div class="section-head">
      <h2>Results for “<span id="searchQuery"></span>”</h2>
      <span class="hint" id="searchStatus"></span>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="grid" id="searchGrid"></div>
    <div id="searchSentinel" class="sentinel" aria-hidden="true"></div>
    <div id="searchLoading" class="search-loading" hidden>
      <div class="spinner" style="width:18px;height:18px;border-width:2px"></div>
      <span>Loading more…</span>
    </div>
    <div id="searchEndMsg" class="end-msg" hidden>— End of results —</div>
  </section>
</main>

<div id="pageBar" class="page-bar" hidden>
  <button class="page-btn" id="pagePrev" title="Previous page">‹</button>
  <span class="page-label">
    <span class="page-cur" id="pageCur">1</span>
    <span class="page-sep">/</span>
    <span class="page-total" id="pageTotal">1</span>
  </span>
  <button class="page-btn" id="pageNext" title="Next page">›</button>
  <input type="number" class="jump-input" id="pageJump" min="1" placeholder="Go" />
  <button class="jump-btn" id="pageJumpBtn">GO</button>
</div>

<div class="toast" id="toast"></div>

<script>
const PROXY_URL = location.origin;
const BASE = "https://officialmoviebox.com";

const MOVIEBOX_VIRTUAL = {
  id: "__moviebox",
  name: "MovieBox",
  url: BASE,
  has_plugin: true,
  isVirtual: true,
};

const PAGE_SIZE = 40;
const PREFETCH_AHEAD = 1;

let PROVIDERS = [];
let currentSearchQuery = "";

/* ─────── search pagination state ─────── */
const S = {
  active: false,
  query: "",
  page: 0,
  hasMore: true,
  loading: false,
  activeFilter: "all",
  groups: {},             // pid -> accumulated items
  totalCounts: {},        // pid -> count
  seenKeys: new Set(),
  itemMap: new Map(),     // itemKey -> item (for click lookup)
  providerExhausted: {},  // pid -> true when no more pages
  pageAnchors: [],        // DOM elements marking each loaded page start
  currentPage: 1,
  lastMs: 0,
  abort: null,
  pageItemCounts: [],     // how many items each page contributed (for anchor math)
};

/* ─────── helpers ─────── */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function imgUrl(v) {
  if (!v) return "";
  if (typeof v === "string") return v.startsWith("//") ? "https:" + v : v;
  return v.url || v.src || v.path || "";
}
function showToast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), ms || 2400);
}
function proxyFor(url, referer, providerId) {
  let q = PROXY_URL + "/?url=" + encodeURIComponent(url)
        + "&referer=" + encodeURIComponent(referer || BASE + "/");
  if (providerId) q += "&provider=" + encodeURIComponent(providerId);
  return q;
}
function providerDisplayName(pid) {
  if (pid === "__moviebox") return "MovieBox";
  const p = PROVIDERS.find(x => x.id === pid);
  return p?.name || pid;
}
function itemKey(item) {
  return (item.detailPath || item.pageUrl || item.title || "") + "|" + item.providerId;
}

/* ─────── Nuxt3 decoder ─────── */
const DEVALUE_WRAPPERS = {
  ShallowReactive: v => v, Reactive: v => v, Ref: v => v,
  ShallowRef: v => v, EmptyRef: () => undefined, EmptyShallowRef: () => undefined,
  Set: v => v, Map: v => v, Date: v => v, RegExp: v => v, BigInt: v => v,
  "null": () => null, "undefined": () => undefined, NaN: () => NaN,
  Infinity: () => Infinity, "-Infinity": () => -Infinity,
};
function devalueResolve(arr) {
  const cache = new Map();
  function go(ref) {
    if (ref === null || ref === undefined) return ref;
    if (typeof ref !== "number") return ref;
    if (cache.has(ref)) return cache.get(ref);
    const v = arr[ref];
    if (v === null || v === undefined || typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
      cache.set(ref, v); return v;
    }
    if (Array.isArray(v)) {
      if (v.length >= 1 && typeof v[0] === "string" && DEVALUE_WRAPPERS[v[0]]) {
        const inner = v.length > 1 ? go(v[1]) : undefined;
        const wrapped = DEVALUE_WRAPPERS[v[0]](inner);
        cache.set(ref, wrapped); return wrapped;
      }
      const out = []; cache.set(ref, out);
      for (const item of v) out.push(go(item));
      return out;
    }
    if (typeof v === "object") {
      const out = {}; cache.set(ref, out);
      for (const k of Object.keys(v)) out[k] = go(v[k]);
      return out;
    }
    cache.set(ref, v); return v;
  }
  return go(0);
}
function extractNuxt3Payload(html) {
  const m = html.match(/<script[^>]*id=["']__NUXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try {
    const arr = JSON.parse(m[1]);
    if (!Array.isArray(arr)) return null;
    return devalueResolve(arr);
  } catch (_) { return null; }
}
function findSubjects(root) {
  const seen = new Set();
  const out = [];
  const visited = new WeakSet();
  function walk(node, depth) {
    if (depth > 40 || !node || typeof node !== "object" || visited.has(node)) return;
    visited.add(node);
    if (Array.isArray(node)) { for (const item of node) walk(item, depth + 1); return; }
    if (typeof node.detailPath === "string" && node.detailPath.length > 0 &&
        typeof node.title === "string" && node.title.length > 0 && node.subjectId !== undefined) {
      if (!seen.has(node.detailPath)) {
        seen.add(node.detailPath);
        out.push({
          title: node.title, detailPath: node.detailPath,
          subjectId: String(node.subjectId || ""),
          image: imgUrl(node.cover),
          isTV: Number(node.subjectType) === 2,
          hasResource: node.hasResource !== false,
        });
      }
    }
    for (const k of Object.keys(node)) walk(node[k], depth + 1);
  }
  walk(root, 0);
  return out.filter(s => s.hasResource);
}

/* ─────── provider discovery ─────── */
async function loadProviders() {
  try {
    const res = await fetch(PROXY_URL + "/providers");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = await res.json();
    PROVIDERS = (list || []).filter(p => p && p.has_plugin);
  } catch (e) {
    console.warn("[providers] fetch failed:", e);
    PROVIDERS = [];
  }
  const hasMovieBoxProvider = PROVIDERS.some(
    p => /moviebox/i.test(p.name) || /moviebox/i.test(p.url || "")
  );
  if (!hasMovieBoxProvider) PROVIDERS = [MOVIEBOX_VIRTUAL, ...PROVIDERS];

  document.getElementById("providerHint").textContent =
    PROVIDERS.length + " source" + (PROVIDERS.length === 1 ? "" : "s");
  document.getElementById("providerList").innerHTML =
    PROVIDERS.map(p =>
      `<span style="display:inline-block;margin:4px 6px 4px 0;padding:6px 12px;` +
      `background:#1e1e25;border:1px solid #2a2a33;border-radius:999px;font-size:12.5px;` +
      `font-weight:600;color:#e5e5ea">${escapeHtml(p.name)}</span>`
    ).join("") +
    '<div style="margin-top:14px;color:#8a8a94;font-size:13px">' +
    'Type in the search bar above to search all providers at once.</div>';
}

/* ─────── trending ─────── */
async function fetchMovieBoxTrending(tabId, page, signal) {
  const params = new URLSearchParams({ page: String(page || 1), perPage: "36" });
  if (tabId) params.set("tabId", tabId);
  const realUrl = BASE + "/wefeed-h5api-bff/subject/trending?" + params;
  const r = await fetch(proxyFor(realUrl, BASE + "/"), { signal });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const json = await r.json();
  if (json.code !== 0) throw new Error("code " + json.code);
  return json.data?.subjectList || [];
}
function normalizeMovieBoxItem(s) {
  return {
    providerId: MOVIEBOX_VIRTUAL.id,
    providerName: MOVIEBOX_VIRTUAL.name,
    title: s.title || "Untitled",
    image: imgUrl(s.cover),
    detailPath: s.detailPath || "",
    subjectId: String(s.subjectId || ""),
    pageUrl: "",
    isSeries: Number(s.subjectType) === 2,
    isMovieBox: true,
  };
}
async function loadTrending() {
  const rowMovies = document.getElementById("rowMovies");
  const rowTV = document.getElementById("rowTV");
  const [moviesR, tvR] = await Promise.allSettled([
    fetchMovieBoxTrending("ONEROOM_MOVIE", 1),
    fetchMovieBoxTrending(null, 1),
  ]);
  if (moviesR.status === "fulfilled") {
    const items = moviesR.value.map(normalizeMovieBoxItem);
    document.getElementById("hintMovies").textContent = items.length + " titles";
    renderRow(rowMovies, items);
  } else {
    rowMovies.innerHTML = '<div class="empty">Could not load trending movies.</div>';
    document.getElementById("hintMovies").textContent = "";
  }
  if (tvR.status === "fulfilled") {
    const items = tvR.value.map(normalizeMovieBoxItem);
    document.getElementById("hintTV").textContent = items.length + " shows";
    renderRow(rowTV, items);
  } else {
    rowTV.innerHTML = '<div class="empty">Could not load trending TV shows.</div>';
    document.getElementById("hintTV").textContent = "";
  }
}

/* ─────── card rendering ─────── */
function cardHtml(item) {
  const badge = item.isSeries ? "TV" : "Movie";
  const img = item.image
    ? `<img src="${escapeHtml(item.image)}" alt="" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : "";
  const fallback = `<div class="fallback" ${item.image ? 'style="display:none"' : ""}>
    ${escapeHtml((item.title || "?").charAt(0).toUpperCase())}
  </div>`;
  const providerClass = item.providerId === MOVIEBOX_VIRTUAL.id ? "" : "neutral";
  return `<button class="card" data-key="${escapeHtml(itemKey(item))}">
    <div class="poster">${img}${fallback}
      <span class="badge">${badge}</span>
      <span class="provider-tag ${providerClass}">${escapeHtml(item.providerName)}</span>
    </div>
    <div class="card-title">${escapeHtml(item.title)}</div>
  </button>`;
}
function renderRow(container, items) {
  if (!items || !items.length) { container.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  container.innerHTML = items.map(cardHtml).join("");
  container.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.key;
      const item = S.itemMap.get(key) || items.find(it => itemKey(it) === key);
      if (item) handleCardClick(item);
    });
  });
  for (const it of items) S.itemMap.set(itemKey(it), it);
}

/* ─────── search: per-provider page fetch ─────── */
async function searchMovieBoxPage(q, page, signal) {
  for (const param of ["keyword", "q", "query"]) {
    try {
      const apiUrl = BASE + "/wefeed-h5api-bff/subject/search?" +
        new URLSearchParams({ [param]: q, page: String(page), perPage: String(PAGE_SIZE) });
      const r = await fetch(proxyFor(apiUrl, BASE + "/"), { signal });
      if (r.ok) {
        const json = await r.json();
        const list = json.data?.subjectList || json.data?.items || json.data?.list || [];
        if (list.length) return list.map(normalizeMovieBoxItem);
      }
    } catch (_) {}
  }
  // Nuxt fallback for page 1 only
  if (page === 1) {
    try {
      const searchUrl = BASE + "/search?q=" + encodeURIComponent(q);
      const r = await fetch(proxyFor(searchUrl, BASE + "/"), { signal });
      if (!r.ok) return [];
      const resolved = extractNuxt3Payload(await r.text());
      if (!resolved) return [];
      return findSubjects(resolved).map(s => ({
        providerId: MOVIEBOX_VIRTUAL.id,
        providerName: MOVIEBOX_VIRTUAL.name,
        title: s.title, image: s.image,
        detailPath: s.detailPath, subjectId: s.subjectId,
        pageUrl: "", isSeries: s.isTV, isMovieBox: true,
      }));
    } catch (_) { return []; }
  }
  return [];
}

async function searchProviderPage(p, q, page, signal) {
  if (page > 1) return [];  // plugins don't paginate; only page 1 is valid
  try {
    const url = PROXY_URL + "/providers/" + encodeURIComponent(p.id) +
                "/search?q=" + encodeURIComponent(q);
    const r = await fetch(url, { signal });
    if (!r.ok) return [];
    const json = await r.json();
    const list = json.results || json.data || json.items || json.list || [];
    return list.map(item => normalizeGenericItem(item, p));
  } catch (e) {
    if (e.name === "AbortError") throw e;
    return [];
  }
}

function normalizeGenericItem(item, p) {
  const isMovieBoxShape = !!(item.detailPath && item.subjectId);
  if (isMovieBoxShape) return normalizeMovieBoxItem(item);
  return {
    providerId: p.id,
    providerName: p.name,
    title: item.title || item.name || "Untitled",
    image: imgUrl(item.image || item.cover || item.poster),
    detailPath: "",
    subjectId: "",
    pageUrl: item.url || item.href || "",
    isSeries: item.type === "tv" || item.isTV === true || Number(item.subjectType) === 2,
    isMovieBox: false,
  };
}

/* ─────── search: state + paginated loading ─────── */
function resetSearchState(q) {
  S.active = true;
  S.query = q;
  S.page = 0;
  S.hasMore = true;
  S.loading = false;
  S.activeFilter = "all";
  S.groups = {};
  S.totalCounts = {};
  S.seenKeys = new Set();
  S.itemMap = new Map();
  S.providerExhausted = {};
  S.pageAnchors = [];
  S.pageItemCounts = [];
  S.currentPage = 1;
  S.lastMs = 0;
}

async function doSearch(q) {
  q = (q || "").trim();
  currentSearchQuery = q;
  const browse = document.getElementById("browseSection");
  const search = document.getElementById("searchSection");
  const grid = document.getElementById("searchGrid");
  const filterBar = document.getElementById("filterBar");
  const status = document.getElementById("searchStatus");
  const qLabel = document.getElementById("searchQuery");
  const loadingEl = document.getElementById("searchLoading");
  const endMsg = document.getElementById("searchEndMsg");

  if (q.length < 2) {
    search.hidden = true;
    browse.hidden = false;
    S.active = false;
    hidePageBar();
    return;
  }

  // Reset UI
  browse.hidden = true;
  search.hidden = false;
  qLabel.textContent = q;
  status.textContent = "Searching " + PROVIDERS.length + " source(s)…";
  grid.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div>Searching…</div>';
  filterBar.innerHTML = "";
  loadingEl.hidden = true;
  endMsg.hidden = true;
  hidePageBar();

  // Abort previous search
  if (S.abort) { try { S.abort.abort(); } catch (_) {} }
  S.abort = new AbortController();

  // Reset state
  resetSearchState(q);

  await loadSearchPage(1);
}

async function loadSearchPage(n) {
  if (S.loading) return;
  if (n > 1 && !S.hasMore) return;

  S.loading = true;

  if (n > 1) {
    document.getElementById("searchLoading").hidden = false;
  }

  const signal = S.abort ? S.abort.signal : undefined;
  const t0 = performance.now();

  // Determine which providers to hit
  const activeProviders = PROVIDERS.filter(p => !S.providerExhausted[p.id]);
  if (!activeProviders.length) {
    S.hasMore = false;
    S.loading = false;
    document.getElementById("searchLoading").hidden = true;
    document.getElementById("searchEndMsg").hidden = false;
    return;
  }

  let results;
  try {
    results = await Promise.all(activeProviders.map(async p => {
      try {
        let items;
        if (p.id === MOVIEBOX_VIRTUAL.id) {
          items = await searchMovieBoxPage(S.query, n, signal);
        } else {
          items = await searchProviderPage(p, S.query, n, signal);
        }
        return { pid: p.id, items: items || [] };
      } catch (e) {
        if (e.name === "AbortError") throw e;
        return { pid: p.id, items: [] };
      }
    }));
  } catch (e) {
    if (e.name === "AbortError") return;
    S.loading = false;
    document.getElementById("searchLoading").hidden = true;
    if (n === 1) {
      document.getElementById("searchGrid").innerHTML =
        '<div class="empty">Search failed.</div>';
    }
    return;
  }

  if (signal && signal.aborted) return;

  S.lastMs += Math.round(performance.now() - t0);

  // Merge results, dedupe
  const newItemsInterleaved = [];
  const seenThisPage = new Set();

  // Build interleaved list from all providers
  const perProv = results.map(r => ({ pid: r.pid, arr: r.items, i: 0 }));
  let remaining = true;
  while (remaining) {
    remaining = false;
    for (const p of perProv) {
      if (p.i < p.arr.length) {
        const it = p.arr[p.i++];
        const k = itemKey(it);
        if (S.seenKeys.has(k)) continue;
        if (seenThisPage.has(k)) continue;
        seenThisPage.add(k);
        newItemsInterleaved.push(it);
        remaining = true;
      }
    }
  }

  // Register into state
  for (const it of newItemsInterleaved) {
    const k = itemKey(it);
    S.seenKeys.add(k);
    const group = S.groups[it.providerId] || (S.groups[it.providerId] = []);
    group.push(it);
    S.totalCounts[it.providerId] = group.length;
    S.itemMap.set(k, it);
  }

  // Mark providers that returned 0 for this page (exhaustion)
  for (const r of results) {
    if (!r.items.length) {
      S.providerExhausted[r.pid] = true;
    }
    // non-MovieBox only has 1 page
    if (n === 1 && r.pid !== MOVIEBOX_VIRTUAL.id) {
      S.providerExhausted[r.pid] = true;
    }
  }

  S.page = n;

  // Check if any provider has more
  S.hasMore = !PROVIDERS.every(p => S.providerExhausted[p.id]);

  // First page: reset grid
  const grid = document.getElementById("searchGrid");
  if (n === 1) {
    grid.innerHTML = "";
  }

  // Append new items (respect current filter)
  const filter = S.activeFilter;
  const itemsToAppend = filter === "all"
    ? newItemsInterleaved
    : newItemsInterleaved.filter(it => it.providerId === filter);

  let pageAnchor = null;
  let appendedThisPage = 0;

  for (const it of itemsToAppend) {
    grid.insertAdjacentHTML("beforeend", cardHtml(it));
    if (!pageAnchor) pageAnchor = grid.lastElementChild;
    appendedThisPage++;
  }

  // Register anchor for this page (only if filter is "all" — page bar makes sense there)
  if (pageAnchor && filter === "all") {
    S.pageAnchors.push(pageAnchor);
  }
  S.pageItemCounts.push(appendedThisPage);

  // Insert sentinel + end msg if missing (they get wiped when we cleared grid.innerHTML)
  ensureSearchFooter();

  // Empty state on first page
  if (n === 1 && newItemsInterleaved.length === 0) {
    grid.innerHTML =
      '<div class="empty"><strong>No results found.</strong><br>' +
      '<span style="font-size:12px">Nothing matched "' + escapeHtml(S.query) + '" on any provider.</span></div>';
  }

  S.loading = false;
  document.getElementById("searchLoading").hidden = true;

  // Filter pills
  rebuildFilterBar();
  updateSearchStatus();

  // Page bar
  if (filter === "all" && S.pageAnchors.length > 0) {
    showPageBar();
    updatePageBar();
  } else {
    hidePageBar();
  }

  // End message
  document.getElementById("searchEndMsg").hidden = S.hasMore || newItemsInterleaved.length === 0;

  // Prefetch
  if (S.hasMore && !S.loading) {
    maybePrefetch();
  }
}

function ensureSearchFooter() {
  const grid = document.getElementById("searchGrid");
  const search = document.getElementById("searchSection");
  // The sentinel/loading/endMsg elements live in the section, not the grid,
  // so they persist across grid.innerHTML resets
  // (nothing to do here — they're siblings of the grid)
}

/* ─────── filter bar ─────── */
function rebuildFilterBar() {
  const filterBar = document.getElementById("filterBar");
  const total = Object.values(S.totalCounts).reduce((a, b) => a + b, 0);

  const pills = [];
  pills.push(`
    <button class="filter-pill ${S.activeFilter === "all" ? "active" : ""}" data-filter="all">
      <span>All results</span>
      <span class="count">${total}</span>
    </button>
  `);

  for (const p of PROVIDERS) {
    const count = S.totalCounts[p.id] || 0;
    const name = providerDisplayName(p.id);
    const isActive = S.activeFilter === p.id;
    pills.push(`
      <button class="filter-pill ${isActive ? "active" : ""}" data-filter="${escapeHtml(p.id)}" data-provider="${escapeHtml(p.id)}">
        <span class="provider-dot"></span>
        <span>${escapeHtml(name)}</span>
        <span class="count">${count}</span>
      </button>
    `);
  }

  filterBar.innerHTML = pills.join("");

  filterBar.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const newFilter = btn.dataset.filter;
      if (newFilter === S.activeFilter) return;
      S.activeFilter = newFilter;
      rebuildFilterBar();
      rerenderGridForFilter();
    });
  });
}

function rerenderGridForFilter() {
  const grid = document.getElementById("searchGrid");
  grid.innerHTML = "";
  S.pageAnchors = [];

  let items;
  if (S.activeFilter === "all") {
    // Interleave all groups
    const perProv = Object.entries(S.groups).map(([pid, arr]) => ({ pid, arr, i: 0 }));
    items = [];
    let remaining = true;
    while (remaining) {
      remaining = false;
      for (const p of perProv) {
        if (p.i < p.arr.length) {
          items.push(p.arr[p.i++]);
          remaining = true;
        }
      }
    }
  } else {
    items = S.groups[S.activeFilter] || [];
  }

  if (!items.length) {
    grid.innerHTML =
      '<div class="empty"><strong>No results from this provider.</strong><br>' +
      '<span style="font-size:12px">Try "All results" to see other providers.</span></div>';
    hidePageBar();
    document.getElementById("searchEndMsg").hidden = true;
    return;
  }

  // Append all
  let currentAnchor = null;
  let cardInPage = 0;
  const anchorCount = S.pageAnchors.length;

  // For filtered views, we can't track pages precisely — just append all
  for (const it of items) {
    grid.insertAdjacentHTML("beforeend", cardHtml(it));
  }

  // Page bar only in "all" view
  if (S.activeFilter === "all") {
    // Reconstruct anchors approximately: split by pageItemCounts totals
    // Actually if we're re-rendering filtered, we lose precise page positions.
    // Simpler: hide page bar when filtered.
  }

  // End message
  document.getElementById("searchEndMsg").hidden = S.hasMore || S.activeFilter !== "all";
  if (S.activeFilter !== "all") {
    hidePageBar();
  } else {
    // Not ideal — but we lose page anchors when re-rendering. Show end msg only.
    hidePageBar();
  }
}

/* ─────── status line ─────── */
function updateSearchStatus() {
  const status = document.getElementById("searchStatus");
  const total = Object.values(S.totalCounts).reduce((a, b) => a + b, 0);
  const breakdown = PROVIDERS
    .map(p => {
      const c = S.totalCounts[p.id] || 0;
      if (c === 0) return null;
      return escapeHtml(providerDisplayName(p.id)) + ": " + c;
    })
    .filter(Boolean)
    .join(" · ");
  status.innerHTML = `${total} results · ${S.lastMs}ms` +
    (breakdown ? ' · ' + breakdown : '') +
    (S.hasMore ? ' · more available' : '');
}

/* ─────── infinite scroll ─────── */
const sentinelObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    if (!S.active) continue;
    if (S.loading) continue;
    if (!S.hasMore) continue;
    loadSearchPage(S.page + 1);
  }
}, { rootMargin: "800px 0px" });
sentinelObserver.observe(document.getElementById("searchSentinel"));

// Scroll fallback
let scrollTimer = null;
window.addEventListener("scroll", () => {
  if (!S.active) return;
  if (S.loading || !S.hasMore) return;
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    const bottom = window.scrollY + window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;
    if (docHeight - bottom < 900) {
      loadSearchPage(S.page + 1);
    }
  }, 200);
}, { passive: true });

function maybePrefetch() {
  if (!S.hasMore || S.loading || !S.active) return;
  // Prefetch one page ahead silently
  // (skip for simplicity — infinite scroll handles it fast enough)
}

/* ─────── page bar (search only) ─────── */
const pageBar = document.getElementById("pageBar");
const pagePrev = document.getElementById("pagePrev");
const pageNext = document.getElementById("pageNext");
const pageCurEl = document.getElementById("pageCur");
const pageTotalEl = document.getElementById("pageTotal");
const pageJump = document.getElementById("pageJump");
const pageJumpBtn = document.getElementById("pageJumpBtn");

function showPageBar() { pageBar.hidden = false; pageBar.classList.remove("fade"); }
function hidePageBar() { pageBar.hidden = true; pageBar.classList.remove("fade"); }

function updatePageBar() {
  pageCurEl.textContent = S.currentPage;
  const total = S.pageAnchors.length || 1;
  pageTotalEl.textContent = total + (S.hasMore ? "+" : "");
  pagePrev.disabled = S.currentPage <= 1;
  pageNext.disabled = S.currentPage >= total && !S.hasMore;
  pageJump.max = S.hasMore ? "" : String(total);
}

function updateCurrentPageFromScroll() {
  if (pageBar.hidden) return;
  if (!S.pageAnchors.length) return;
  const probe = window.scrollY + window.innerHeight * 0.30;
  let cur = 1;
  for (let i = 0; i < S.pageAnchors.length; i++) {
    const el = S.pageAnchors[i];
    if (!el || !el.isConnected) continue;
    const top = el.getBoundingClientRect().top + window.scrollY;
    if (top <= probe) cur = i + 1;
    else break;
  }
  if (cur !== S.currentPage) {
    S.currentPage = cur;
    updatePageBar();
  }
}

async function scrollToPage(n) {
  if (n < 1) n = 1;
  while (n > S.pageAnchors.length && S.hasMore && !S.loading) {
    await loadSearchPage(S.page + 1);
  }
  const idx = Math.min(n, S.pageAnchors.length) - 1;
  const el = S.pageAnchors[idx];
  if (!el || !el.isConnected) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const top = el.getBoundingClientRect().top + window.scrollY - 60;
  window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

pagePrev.addEventListener("click", () => {
  if (S.currentPage > 1) scrollToPage(S.currentPage - 1);
  else window.scrollTo({ top: 0, behavior: "smooth" });
});
pageNext.addEventListener("click", async () => {
  const total = S.pageAnchors.length;
  if (S.currentPage < total) scrollToPage(S.currentPage + 1);
  else if (S.hasMore) {
    await loadSearchPage(S.page + 1);
    scrollToPage(S.currentPage + 1);
  }
});
function handleJump() {
  const raw = pageJump.value.trim();
  if (!raw) { pageJump.blur(); return; }
  const n = Math.max(1, parseInt(raw, 10) || 1);
  pageJump.value = "";
  pageJump.blur();
  scrollToPage(n);
}
pageJumpBtn.addEventListener("click", handleJump);
pageJump.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); handleJump(); pageJump.blur(); }
});

let pageBarFadeTimer = null;
window.addEventListener("scroll", () => {
  if (S.active) updateCurrentPageFromScroll();
  if (!pageBar.hidden) {
    pageBar.classList.add("fade");
    clearTimeout(pageBarFadeTimer);
    pageBarFadeTimer = setTimeout(() => pageBar.classList.remove("fade"), 900);
  }
}, { passive: true });

/* ─────── card click (delegated) ─────── */
document.getElementById("searchGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const key = card.dataset.key;
  const item = S.itemMap.get(key);
  if (item) handleCardClick(item);
});

function handleCardClick(item) {
  if (item.isMovieBox && item.detailPath && item.subjectId) {
    const params = new URLSearchParams({
      source: "moviebox",
      detailPath: item.detailPath,
      subjectId: item.subjectId,
      title: item.title,
    });
    location.href = "detail.html?" + params.toString();
    return;
  }
  if (!item.pageUrl) {
    showToast("This item has no playable page.");
    return;
  }
  const params = new URLSearchParams({
    source: item.providerId,
    url: item.pageUrl,
    title: item.title,
  });
  location.href = "detail.html?" + params.toString();
}

/* ─────── search wiring ─────── */
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
let searchTimer = null;

searchInput.addEventListener("input", (e) => {
  const v = e.target.value;
  searchClear.hidden = v.length === 0;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(v), 420);
});
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    searchInput.value = "";
    searchClear.hidden = true;
    doSearch("");
  }
  if (e.key === "Enter") {
    e.preventDefault();
    clearTimeout(searchTimer);
    doSearch(searchInput.value);
  }
});
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchClear.hidden = true;
  doSearch("");
  searchInput.focus();
});

/* ─────── boot ─────── */
(async function boot() {
  await loadProviders();
  await loadTrending();
})();
</script>
