<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Browse — Movies & TV</title>

<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="dns-prefetch" href="https://image.tmdb.org">
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
<link rel="dns-prefetch" href="https://api.themoviedb.org">

<style>
  :root{
    --accent:#e50914; --accent-2:#f6121d;
    --bg:#000; --card:#1e1e25; --card-2:#26262f;
    --line:#2a2a33; --text:#f5f5f7; --muted:#8a8a94;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
  img{display:block}
  button{font-family:inherit;color:inherit;cursor:pointer}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:16px;
    padding:14px 22px;
    background:linear-gradient(180deg,rgba(0,0,0,.95) 60%,rgba(0,0,0,.6));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.3px;color:#fff;white-space:nowrap;flex-shrink:0}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .search-wrap{flex:1;max-width:640px;position:relative;display:flex;align-items:center}
  .search-wrap svg.search-ico{position:absolute;left:14px;width:18px;height:18px;fill:var(--muted);pointer-events:none;transition:fill .15s}
  .search-wrap:focus-within svg.search-ico{fill:#fff}
  #searchInput{width:100%;height:44px;padding:0 40px 0 44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#fff;border-radius:var(--radius);font-size:14px;font-family:inherit;outline:none;transition:border .15s,background .15s}
  #searchInput::placeholder{color:var(--muted)}
  #searchInput:focus{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.10)}
  #searchClear{position:absolute;right:8px;width:30px;height:30px;border-radius:6px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  #searchClear:hover{background:rgba(255,255,255,.08);color:#fff}
  #searchClear[hidden]{display:none}

  main{padding:24px 22px 120px;max-width:1600px;margin:0 auto}
  section[hidden]{display:none!important}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 14px}
  .section-head:first-child{margin-top:0}
  .section-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .section-head .hint{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 16px;scroll-snap-type:x proximity;scrollbar-width:thin}
  .row::-webkit-scrollbar{height:8px}
  .row::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:4px}
  .row::-webkit-scrollbar-thumb:hover{background:#3a3a44}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px}

  .card{display:flex;flex-direction:column;gap:8px;background:transparent;border:none;padding:0;text-align:left;color:inherit;scroll-snap-align:start;flex-shrink:0;transition:transform .15s ease;-webkit-tap-highlight-color:transparent}
  .row .card{width:168px}
  .card:hover{transform:translateY(-3px)}
  .card:active{transform:translateY(-1px) scale(.98)}

  .poster{position:relative;width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#1a1a20 0%,#0a0a0d 100%);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  .poster img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}
  .card:hover .poster img{transform:scale(1.05)}
  .poster .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:rgba(255,255,255,.22)}
  .poster .badge,.poster .rating{position:absolute;padding:2px 6px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(4px)}
  .poster .badge{top:6px;left:6px;background:rgba(0,0,0,.72);color:#fff}
  .poster .rating{top:6px;right:6px;background:rgba(0,0,0,.72);color:#ffc93c;border-color:rgba(255,201,60,.35);text-transform:none}

  .card-title{font-size:13px;font-weight:600;line-height:1.3;color:#e5e5ea;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px}

  .spinner-wrap{display:flex;align-items:center;justify-content:center;padding:70px 20px;gap:12px;color:var(--muted);font-size:13px}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:70px 24px;color:var(--muted);font-size:14px}
  .empty strong{color:#fff;font-weight:700}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 16px;margin-bottom:14px}
  .filter-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:#e5e5ea;border-radius:999px;font-size:13px;font-weight:700;transition:.15s}
  .filter-pill:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.20)}
  .filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.35)}
  .filter-pill .count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;background:rgba(255,255,255,.15);border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .filter-pill.active .count{background:rgba(0,0,0,.25)}

  .sentinel{grid-column:1/-1;height:1px;pointer-events:none;opacity:0}
  .end-msg{grid-column:1/-1;text-align:center;padding:36px 20px 20px;color:var(--muted);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;user-select:none}
  .end-msg[hidden]{display:none}
  .search-loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:30px;gap:12px;color:var(--muted);font-size:12.5px}
  .search-loading[hidden]{display:none}

  .page-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(23,23,28,.92);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 12px 40px rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:150;transition:opacity .18s}
  .page-bar[hidden]{display:none}
  .page-bar.fade{opacity:.35}
  .page-bar.fade:hover{opacity:1}
  .page-btn{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#e5e5ea;font-size:20px;line-height:1;font-weight:600;border-radius:999px;cursor:pointer;transition:.15s}
  .page-btn:hover:not(:disabled){background:rgba(255,255,255,.10);color:#fff}
  .page-btn:disabled{opacity:.28;cursor:default}
  .page-label{font-size:12.5px;font-weight:700;color:#e5e5ea;font-variant-numeric:tabular-nums;min-width:70px;text-align:center;padding:0 6px;user-select:none}
  .page-label .page-cur{color:#fff}
  .page-label .page-sep{color:#6b7280;margin:0 3px}
  .page-label .page-total{color:var(--muted)}
  .page-bar .jump-input{width:52px;height:34px;flex:none;background:#101014;border:1px solid var(--line);color:#e5e5ea;font-size:13px;font-weight:600;border-radius:999px;text-align:center;outline:none;font-variant-numeric:tabular-nums;padding:0 4px;-moz-appearance:textfield}
  .page-bar .jump-input:focus{border-color:var(--accent)}
  .page-bar .jump-input::-webkit-outer-spin-button,
  .page-bar .jump-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .page-bar .jump-btn{height:34px;padding:0 12px;flex:none;background:var(--card-2);border:1px solid var(--line);color:#e5e5ea;font-size:12px;font-weight:700;border-radius:999px;cursor:pointer;transition:.15s}
  .page-bar .jump-btn:hover{background:#26262f;border-color:#4a4a58;color:#fff}

  .toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);padding:11px 18px;border-radius:10px;background:rgba(20,20,24,.96);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .topbar{padding:12px 14px;gap:10px}
    .brand{font-size:15px}
    .brand .dot{width:8px;height:8px}
    #searchInput{height:40px;font-size:13.5px;padding:0 36px 0 40px}
    main{padding:16px 14px 110px}
    .section-head h2{font-size:17px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 10px}
    .row .card{width:132px}
    .row{gap:10px}
    .filter-pill{padding:8px 12px;font-size:12px}
    .filter-pill .count{min-width:18px;height:18px;padding:0 5px;font-size:10px}
    .page-bar{bottom:14px;padding:5px 6px;gap:4px}
    .page-btn{width:32px;height:32px;font-size:19px}
    .page-label{min-width:58px;font-size:12px;padding:0 4px}
    .page-bar .jump-input{width:44px;height:32px;font-size:12px}
    .page-bar .jump-btn{height:32px;padding:0 10px;font-size:11px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Browse</div>
  <div class="search-wrap">
    <svg class="search-ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="searchInput" type="search" placeholder="Search movies, TV shows, people…" autocomplete="off" />
    <button id="searchClear" hidden aria-label="Clear">✕</button>
  </div>
</header>

<main>
  <section id="browseSection">
    <div id="browseRows"></div>
  </section>

  <section id="searchSection" hidden>
    <div class="section-head">
      <h2>Results for “<span id="searchQuery"></span>”</h2>
      <span class="hint" id="searchStatus"></span>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="grid" id="searchGrid"></div>
    <div id="searchSentinel" class="sentinel" aria-hidden="true"></div>
    <div id="searchLoading" class="search-loading" hidden>
      <div class="spinner" style="width:18px;height:18px;border-width:2px"></div>
      <span>Loading more…</span>
    </div>
    <div id="searchEndMsg" class="end-msg" hidden>— End of results —</div>
  </section>
</main>

<div id="pageBar" class="page-bar" hidden>
  <button class="page-btn" id="pagePrev" title="Previous page">‹</button>
  <span class="page-label">
    <span class="page-cur" id="pageCur">1</span>
    <span class="page-sep">/</span>
    <span class="page-total" id="pageTotal">1</span>
  </span>
  <button class="page-btn" id="pageNext" title="Next page">›</button>
  <input type="number" class="jump-input" id="pageJump" min="1" placeholder="Go" />
  <button class="jump-btn" id="pageJumpBtn">GO</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════ */
const TMDB_API_KEY = "09c7460bdc6319d6538d786919306438";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG_POSTER = "https://image.tmdb.org/t/p/w342";
const TMDB_IMG_BACKDROP = "https://image.tmdb.org/t/p/w780";
const TMDB_LANG = "en-US";

/* Rows shown on the browse page */
const BROWSE_ROWS = [
  { title: "Trending Movies",  endpoint: "/trending/movie/week", mediaType: "movie", hint: "This week" },
  { title: "Trending TV Shows", endpoint: "/trending/tv/week",    mediaType: "tv",    hint: "This week" },
  { title: "New Releases",      endpoint: "/movie/now_playing",   mediaType: "movie", hint: "In theaters" },
  { title: "Popular TV",        endpoint: "/tv/popular",          mediaType: "tv",    hint: "All time" },
];

const PAGE_SIZE = 20; // TMDB default; each search page = 20 results

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */
const S = {
  active: false,
  query: "",
  page: 0,
  hasMore: true,
  loading: false,
  totalPages: 0,
  totalResults: 0,
  activeType: "all",       // "all" | "movie" | "tv"
  rawItems: [],            // full list from TMDB for current query (all pages loaded)
  filteredItems: [],       // activeType filter applied
  seenIds: new Set(),
  itemMap: new Map(),      // tmdbId+type -> item
  abort: null,
  lastMs: 0,
  pageAnchors: [],
  currentPage: 1,
};

/* ═══════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function showToast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), ms || 2400);
}

/* ═══════════════════════════════════════════════════
   TMDB FETCHER
   ═══════════════════════════════════════════════════ */
async function tmdbFetch(path, params = {}, signal) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set("api_key", TMDB_API_KEY);
  url.searchParams.set("language", TMDB_LANG);
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, String(v));
  }
  const res = await fetch(url.toString(), { signal });
  if (!res.ok) throw new Error("TMDB " + res.status);
  return res.json();
}

/* Map TMDB result to a card item */
function mapTmdbItem(r) {
  const isTV = r.media_type === "tv" || (!r.title && !!r.name);
  const title = r.title || r.name || "";
  const dateStr = r.release_date || r.first_air_date || "";
  return {
    tmdbId: String(r.id),
    mediaType: isTV ? "tv" : "movie",
    isTV,
    title,
    year: dateStr ? dateStr.slice(0, 4) : "",
    poster: r.poster_path ? TMDB_IMG_POSTER + r.poster_path : "",
    backdrop: r.backdrop_path ? TMDB_IMG_BACKDROP + r.backdrop_path : "",
    rating: r.vote_average ? Number(r.vote_average).toFixed(1) : "",
    overview: r.overview || "",
    popularity: r.popularity || 0,
  };
}

/* ═══════════════════════════════════════════════════
   BROWSE ROWS
   ═══════════════════════════════════════════════════ */
function cardHtml(item, opts = {}) {
  const badge = item.isTV ? "TV" : "Movie";
  const img = item.poster
    ? `<img src="${escapeHtml(item.poster)}" alt="" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : "";
  const fallback = `<div class="fallback" ${item.poster ? 'style="display:none"' : ""}>
    ${escapeHtml((item.title || "?").charAt(0).toUpperCase())}
  </div>`;
  const ratingBadge = item.rating ? `<span class="rating">★ ${escapeHtml(item.rating)}</span>` : "";
  const key = item.tmdbId + "|" + item.mediaType;
  return `<button class="card" data-key="${escapeHtml(key)}">
    <div class="poster">${img}${fallback}
      <span class="badge">${badge}</span>
      ${ratingBadge}
    </div>
    <div class="card-title">${escapeHtml(item.title)}</div>
  </button>`;
}

function renderRow(container, items) {
  if (!items || !items.length) {
    container.innerHTML = '<div class="empty">Nothing to show.</div>';
    return;
  }
  container.innerHTML = items.map(it => cardHtml(it)).join("");
  container.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const [tmdbId, mediaType] = el.dataset.key.split("|");
      const item = S.itemMap.get(el.dataset.key);
      navigateToDetail(tmdbId, mediaType, item?.title || "");
    });
  });
  for (const it of items) {
    S.itemMap.set(it.tmdbId + "|" + it.mediaType, it);
  }
}

async function loadBrowseRows() {
  const rowsWrap = document.getElementById("browseRows");
  rowsWrap.innerHTML = BROWSE_ROWS.map((row, i) => `
    <div class="section-head">
      <h2>${escapeHtml(row.title)}</h2>
      <span class="hint" id="hint-${i}">${escapeHtml(row.hint)}</span>
    </div>
    <div class="row" id="row-${i}">
      <div class="spinner-wrap"><div class="spinner"></div>Loading…</div>
    </div>
  `).join("");

  // Fetch all rows in parallel
  await Promise.all(BROWSE_ROWS.map(async (row, i) => {
    const container = document.getElementById("row-" + i);
    const hint = document.getElementById("hint-" + i);
    try {
      const data = await tmdbFetch(row.endpoint, { page: 1 });
      const items = (data.results || [])
        .filter(r => r && r.poster_path && (r.media_type === row.mediaType || (!r.media_type && row.mediaType)))
        .map(mapTmdbItem)
        .filter(it => it.title);
      if (items.length === 0) {
        container.innerHTML = '<div class="empty">Nothing to show.</div>';
        hint.textContent = "";
        return;
      }
      hint.textContent = items.length + " titles";
      renderRow(container, items);
    } catch (e) {
      console.error("[browse row " + row.title + "]", e);
      container.innerHTML = '<div class="empty">Failed to load.</div>';
      hint.textContent = "";
    }
  }));
}

/* ═══════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════ */
function navigateToDetail(tmdbId, mediaType, title) {
  if (!tmdbId) return;
  const params = new URLSearchParams({
    source: "tmdb",
    tmdbId: String(tmdbId),
    mediaType: mediaType || "movie",
    title: title || "",
  });
  location.href = "detail.html?" + params.toString();
}

/* ═══════════════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════════════ */
function resetSearchState(q) {
  S.active = true;
  S.query = q;
  S.page = 0;
  S.hasMore = true;
  S.loading = false;
  S.totalPages = 0;
  S.totalResults = 0;
  S.activeType = "all";
  S.rawItems = [];
  S.filteredItems = [];
  S.seenIds = new Set();
  S.itemMap = new Map();
  S.pageAnchors = [];
  S.currentPage = 1;
  S.lastMs = 0;
}

async function doSearch(q) {
  q = (q || "").trim();
  const browse = document.getElementById("browseSection");
  const search = document.getElementById("searchSection");
  const grid = document.getElementById("searchGrid");
  const filterBar = document.getElementById("filterBar");
  const status = document.getElementById("searchStatus");
  const qLabel = document.getElementById("searchQuery");
  const loadingEl = document.getElementById("searchLoading");
  const endMsg = document.getElementById("searchEndMsg");

  if (q.length < 2) {
    search.hidden = true;
    browse.hidden = false;
    S.active = false;
    hidePageBar();
    return;
  }

  browse.hidden = true;
  search.hidden = false;
  qLabel.textContent = q;
  status.textContent = "Searching TMDB…";
  grid.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div>Searching…</div>';
  filterBar.innerHTML = "";
  loadingEl.hidden = true;
  endMsg.hidden = true;
  hidePageBar();

  if (S.abort) { try { S.abort.abort(); } catch (_) {} }
  S.abort = new AbortController();
  resetSearchState(q);

  await loadSearchPage(1);
}

async function loadSearchPage(n) {
  if (S.loading) return;
  if (n > 1 && !S.hasMore) return;

  S.loading = true;
  if (n > 1) document.getElementById("searchLoading").hidden = false;

  const signal = S.abort ? S.abort.signal : undefined;
  const t0 = performance.now();
  let data;

  try {
    data = await tmdbFetch("/search/multi", {
      query: S.query,
      page: n,
      include_adult: "false",
    }, signal);
  } catch (e) {
    if (e.name === "AbortError") return;
    S.loading = false;
    document.getElementById("searchLoading").hidden = true;
    if (n === 1) {
      document.getElementById("searchGrid").innerHTML =
        '<div class="empty"><strong>Search failed.</strong><br>' +
        '<span style="font-size:12px">' + escapeHtml(e.message) + '</span></div>';
    }
    return;
  }

  if (signal && signal.aborted) return;

  S.lastMs += Math.round(performance.now() - t0);
  S.totalPages = data.total_pages || 0;
  S.totalResults = data.total_results || 0;

  const results = (data.results || [])
    .filter(r => r && (r.media_type === "movie" || r.media_type === "tv"))
    .map(mapTmdbItem)
    .filter(it => it.title && it.poster);

  // Dedupe against already-seen
  const newItems = [];
  for (const it of results) {
    const key = it.tmdbId + "|" + it.mediaType;
    if (S.seenIds.has(key)) continue;
    S.seenIds.add(key);
    S.rawItems.push(it);
    S.itemMap.set(key, it);
    newItems.push(it);
  }

  S.page = n;
  S.hasMore = n < S.totalPages && n < 500; // TMDB caps at page 500

  // Render
  const grid = document.getElementById("searchGrid");
  if (n === 1) grid.innerHTML = "";
  rebuildFilterBar();
  applyFilterAndRender(newItems);

  S.loading = false;
  document.getElementById("searchLoading").hidden = true;
  document.getElementById("searchEndMsg").hidden = S.hasMore || S.rawItems.length === 0;

  updateSearchStatus();
  if (S.pageAnchors.length > 0) { showPageBar(); updatePageBar(); }
}

function rebuildFilterBar() {
  const filterBar = document.getElementById("filterBar");
  const movieCount = S.rawItems.filter(it => !it.isTV).length;
  const tvCount = S.rawItems.filter(it => it.isTV).length;
  const total = S.rawItems.length;

  const pills = [
    `<button class="filter-pill ${S.activeType === "all" ? "active" : ""}" data-type="all">
      <span>All</span><span class="count">${total}</span>
    </button>`,
    `<button class="filter-pill ${S.activeType === "movie" ? "active" : ""}" data-type="movie">
      <span>Movies</span><span class="count">${movieCount}</span>
    </button>`,
    `<button class="filter-pill ${S.activeType === "tv" ? "active" : ""}" data-type="tv">
      <span>TV Shows</span><span class="count">${tvCount}</span>
    </button>`,
  ];

  filterBar.innerHTML = pills.join("");

  filterBar.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const newType = btn.dataset.type;
      if (newType === S.activeType) return;
      S.activeType = newType;
      rebuildFilterBar();
      rerenderGrid();
      if (newType !== "all") hidePageBar();
    });
  });
}

function applyFilterAndRender(newItems) {
  const itemsToRender = S.activeType === "all"
    ? newItems
    : newItems.filter(it => (S.activeType === "tv" ? it.isTV : !it.isTV));

  if (!itemsToRender.length) return;

  const grid = document.getElementById("searchGrid");
  let firstNew = null;
  for (const it of itemsToRender) {
    const html = cardHtml(it);
    grid.insertAdjacentHTML("beforeend", html);
    if (!firstNew) firstNew = grid.lastElementChild;
  }

  if (firstNew && S.activeType === "all") {
    S.pageAnchors.push(firstNew);
  }

  // Bind click on newly added cards
  grid.querySelectorAll(".card:not([data-bound])").forEach(el => {
    el.dataset.bound = "1";
    el.addEventListener("click", () => {
      const [tmdbId, mediaType] = el.dataset.key.split("|");
      const item = S.itemMap.get(el.dataset.key);
      navigateToDetail(tmdbId, mediaType, item?.title || "");
    });
  });
}

function rerenderGrid() {
  const grid = document.getElementById("searchGrid");
  grid.innerHTML = "";
  S.pageAnchors = [];

  const items = S.activeType === "all"
    ? S.rawItems
    : S.rawItems.filter(it => (S.activeType === "tv" ? it.isTV : !it.isTV));

  if (!items.length) {
    grid.innerHTML =
      '<div class="empty"><strong>No results in this filter.</strong><br>' +
      '<span style="font-size:12px">Try "All" to see everything.</span></div>';
    document.getElementById("searchEndMsg").hidden = true;
    return;
  }

  // Re-render all with anchor tracking (per search page of 20)
  let pageStart = 0;
  const perPage = 20;
  for (let i = 0; i < items.length; i++) {
    if (i % perPage === 0) {
      const marker = document.createElement("div");
      marker.style.cssText = "grid-column:1/-1;height:0";
      grid.appendChild(marker);
      S.pageAnchors.push(marker);
    }
    grid.insertAdjacentHTML("beforeend", cardHtml(items[i]));
  }

  grid.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const [tmdbId, mediaType] = el.dataset.key.split("|");
      const item = S.itemMap.get(el.dataset.key);
      navigateToDetail(tmdbId, mediaType, item?.title || "");
    });
  });

  document.getElementById("searchEndMsg").hidden = S.hasMore || S.activeType !== "all";
  if (S.activeType !== "all") hidePageBar();
}

function updateSearchStatus() {
  const status = document.getElementById("searchStatus");
  const breakdown = [];
  const movieCount = S.rawItems.filter(it => !it.isTV).length;
  const tvCount = S.rawItems.filter(it => it.isTV).length;
  if (movieCount) breakdown.push("Movies: " + movieCount);
  if (tvCount) breakdown.push("TV: " + tvCount);

  status.innerHTML =
    S.rawItems.length + " results" +
    (S.lastMs ? " · " + S.lastMs + "ms" : "") +
    (breakdown.length ? " · " + breakdown.join(" · ") : "") +
    (S.hasMore ? " · more available" : "");
}

/* ═══════════════════════════════════════════════════
   INFINITE SCROLL
   ═══════════════════════════════════════════════════ */
const sentinelObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    if (!S.active) continue;
    if (S.loading) continue;
    if (!S.hasMore) continue;
    loadSearchPage(S.page + 1);
  }
}, { rootMargin: "800px 0px" });
sentinelObserver.observe(document.getElementById("searchSentinel"));

let scrollTimer = null;
window.addEventListener("scroll", () => {
  if (!S.active) return;
  if (S.loading || !S.hasMore) return;
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    const bottom = window.scrollY + window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;
    if (docHeight - bottom < 900) loadSearchPage(S.page + 1);
  }, 200);
}, { passive: true });

/* ═══════════════════════════════════════════════════
   PAGE BAR (only for "All" filter in search)
   ═══════════════════════════════════════════════════ */
const pageBar = document.getElementById("pageBar");
const pagePrev = document.getElementById("pagePrev");
const pageNext = document.getElementById("pageNext");
const pageCurEl = document.getElementById("pageCur");
const pageTotalEl = document.getElementById("pageTotal");
const pageJump = document.getElementById("pageJump");
const pageJumpBtn = document.getElementById("pageJumpBtn");

function showPageBar() { pageBar.hidden = false; pageBar.classList.remove("fade"); }
function hidePageBar() { pageBar.hidden = true; pageBar.classList.remove("fade"); }

function updatePageBar() {
  pageCurEl.textContent = S.currentPage;
  const total = S.pageAnchors.length || 1;
  pageTotalEl.textContent = total + (S.hasMore ? "+" : "");
  pagePrev.disabled = S.currentPage <= 1;
  pageNext.disabled = S.currentPage >= total && !S.hasMore;
}

function updateCurrentPageFromScroll() {
  if (pageBar.hidden) return;
  if (!S.pageAnchors.length) return;
  const probe = window.scrollY + window.innerHeight * 0.30;
  let cur = 1;
  for (let i = 0; i < S.pageAnchors.length; i++) {
    const el = S.pageAnchors[i];
    if (!el || !el.isConnected) continue;
    const top = el.getBoundingClientRect().top + window.scrollY;
    if (top <= probe) cur = i + 1;
    else break;
  }
  if (cur !== S.currentPage) {
    S.currentPage = cur;
    updatePageBar();
  }
}

async function scrollToPage(n) {
  if (n < 1) n = 1;
  while (n > S.pageAnchors.length && S.hasMore && !S.loading) {
    await loadSearchPage(S.page + 1);
  }
  const idx = Math.min(n, S.pageAnchors.length) - 1;
  const el = S.pageAnchors[idx];
  if (!el || !el.isConnected) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const top = el.getBoundingClientRect().top + window.scrollY - 60;
  window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

pagePrev.addEventListener("click", () => {
  if (S.currentPage > 1) scrollToPage(S.currentPage - 1);
  else window.scrollTo({ top: 0, behavior: "smooth" });
});
pageNext.addEventListener("click", async () => {
  const total = S.pageAnchors.length;
  if (S.currentPage < total) scrollToPage(S.currentPage + 1);
  else if (S.hasMore) {
    await loadSearchPage(S.page + 1);
    scrollToPage(S.currentPage + 1);
  }
});
function handleJump() {
  const raw = pageJump.value.trim();
  if (!raw) { pageJump.blur(); return; }
  const n = Math.max(1, parseInt(raw, 10) || 1);
  pageJump.value = "";
  pageJump.blur();
  scrollToPage(n);
}
pageJumpBtn.addEventListener("click", handleJump);
pageJump.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); handleJump(); pageJump.blur(); }
});

window.addEventListener("scroll", () => {
  if (S.active) updateCurrentPageFromScroll();
  if (!pageBar.hidden) {
    pageBar.classList.add("fade");
    clearTimeout(window._pageBarFade);
    window._pageBarFade = setTimeout(() => pageBar.classList.remove("fade"), 900);
  }
}, { passive: true });

/* ═══════════════════════════════════════════════════
   SEARCH INPUT
   ═══════════════════════════════════════════════════ */
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
let searchTimer = null;

searchInput.addEventListener("input", (e) => {
  const v = e.target.value;
  searchClear.hidden = v.length === 0;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(v), 500);
});
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    searchInput.value = "";
    searchClear.hidden = true;
    doSearch("");
  }
  if (e.key === "Enter") {
    e.preventDefault();
    clearTimeout(searchTimer);
    doSearch(searchInput.value);
  }
});
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchClear.hidden = true;
  doSearch("");
  searchInput.focus();
});

/* ═══════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════ */
loadBrowseRows();
</script>
</body>
